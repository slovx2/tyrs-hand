name: Internal deployment artifacts

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 构建目标平台
        required: true
        default: linux/amd64
        type: choice
        options:
          - linux/amd64
          - linux/amd64,linux/arm64

permissions:
  contents: read

concurrency:
  group: internal-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  browser-bridge:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '24.14.0' }
      - id: browser
        name: Read pinned browser sources
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const pin = JSON.parse(fs.readFileSync("deploy/browser/internal-build-lock.json"));
            for (const [key, value] of Object.entries(pin))
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          '
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: slovx2/playwright
          ref: ${{ steps.browser.outputs.playwrightCommit }}
          path: browser-core
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: slovx2/playwright-mcp
          ref: ${{ steps.browser.outputs.bridgeCommit }}
          path: browser-bridge
      - name: Build Core and verify concurrent tab ownership
        working-directory: browser-core
        run: |
          npm ci
          npm run build-tyrs-artifacts -- out/tyrs-browser
          npm run tsc -- --pretty false
          npm run test-mcp -- worker-tab-isolation browser-routing --project=chrome --reporter=line
      - name: Build Bridge bundle
        working-directory: browser-bridge
        run: |
          npm ci
          npm run bridge:test
          npm run build-tyrs-bundle -- ../browser-core/out/tyrs-browser/playwright-core.tgz ../browser-artifacts
      - name: Fetch pinned extension and record build inputs
        env:
          EXTENSION_URL: ${{ steps.browser.outputs.extensionUrl }}
          EXTENSION_SHA: ${{ steps.browser.outputs.extensionSHA256 }}
        run: |
          curl --fail --location --retry 3 "$EXTENSION_URL" -o browser-artifacts/tyrs-browser-extension.crx
          echo "$EXTENSION_SHA  browser-artifacts/tyrs-browser-extension.crx" | sha256sum -c -
          cp deploy/browser/internal-build-lock.json browser-artifacts/
          cp browser-core/out/tyrs-browser/playwright-artifacts.json browser-artifacts/
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with: { cosign-release: v2.5.3 }
      - name: Sign browser artifacts
        working-directory: browser-artifacts
        run: |
          sha256sum tyrs-browser-bridge-bundle.tgz tyrs-browser-extension.crx > SHA256SUMS
          for asset in tyrs-browser-bridge-bundle.tgz tyrs-browser-extension.crx; do
            cosign sign-blob --yes --bundle "${asset}.sigstore.json" "$asset"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-bridge-linux
          path: browser-artifacts/*
          retention-days: 7
          if-no-files-found: error

  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - id: image
        name: Resolve internal deployment image
        shell: bash
        env:
          IMAGE_TARGET: control
        run: |
          version="deploy-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}-${IMAGE_TARGET}"
          {
            echo "repository=${image}"
            echo "tag=${image}:${version}"
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"
          echo "### ${IMAGE_TARGET}: ${version}" >> "${GITHUB_STEP_SUMMARY}"
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          target: control
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.image.outputs.tag }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=internal-control
          cache-to: type=gha,mode=max,scope=internal-control
      - name: Record immutable digest
        env:
          IMAGE: ${{ steps.image.outputs.repository }}
          VERSION: ${{ steps.image.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "${IMAGE}:${VERSION} → ${IMAGE}@${DIGEST}" >> "${GITHUB_STEP_SUMMARY}"
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with: { cosign-release: v2.5.3 }
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: ${{ steps.image.outputs.repository }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Sign image manifest
        env:
          IMAGE: ${{ steps.image.outputs.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  host-worker:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: { go-version: "1.26.6", cache: true }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '24.14.0' }
      - name: Verify user browser MCP configuration
        run: |
          go test ./internal/workerconfig ./internal/worker ./internal/bootstrap ./internal/hostworker
          npm install --prefix /tmp/browser-mcp-cli --save-exact @openai/codex@0.157.1 --no-audit --no-fund
          CODEX_BIN=/tmp/browser-mcp-cli/node_modules/.bin/codex node tools/browser-mcp-config-smoke.mjs
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with: { cosign-release: v2.5.3 }
      - name: Build Linux amd64 host Worker
        shell: bash
        run: |
          version="deploy-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          asset="tyrs-hand-worker_${version}_linux_amd64.tar.gz"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w -buildid= -X github.com/slovx2/tyrs-hand/internal/worker.workerVersion=${version}" \
            -o tyrs-hand-worker ./cmd/tyrs-hand-worker
          tar -czf "${asset}" tyrs-hand-worker deploy/worker
          sha256sum "${asset}" > "${asset}.sha256"
          cosign sign-blob --yes --bundle "${asset}.sigstore.json" "${asset}"
          echo "### host-worker: ${version}" >> "${GITHUB_STEP_SUMMARY}"
          cat "${asset}.sha256" >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: host-worker-linux-amd64
          path: |
            tyrs-hand-worker_*.tar.gz
            tyrs-hand-worker_*.tar.gz.sha256
            tyrs-hand-worker_*.tar.gz.sigstore.json
          retention-days: 7
          if-no-files-found: error

  pi-runtime:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '24.14.0' }
      - id: adapter
        name: Read pinned adapter commit
        run: node -e 'const fs=require("node:fs"); const pin=require("./protocol/adapter-lock.json"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "commit="+pin.commit+"\n");'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: slovx2/codex-harness-adapter
          ref: ${{ steps.adapter.outputs.commit }}
          path: adapter-source
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with: { cosign-release: v2.5.3 }
      - name: Build, self-check and sign Pi runtime
        shell: bash
        run: |
          sh tools/package-pi-runtime.sh adapter-source .artifacts/pi-runtime --internal-build
          for asset in .artifacts/pi-runtime/*.tar.gz; do
            (cd "$(dirname "$asset")" && sha256sum -c "$(basename "$asset").sha256")
            cosign sign-blob --yes --bundle "${asset}.sigstore.json" "${asset}"
            cosign verify-blob --bundle "${asset}.sigstore.json" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/internal-deploy.yml@${GITHUB_REF}" \
              "${asset}"
            echo "### pi-runtime: deploy-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_STEP_SUMMARY}"
            cat "${asset}.sha256" >> "${GITHUB_STEP_SUMMARY}"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pi-runtime-linux-amd64
          path: .artifacts/pi-runtime/*
          retention-days: 7
          if-no-files-found: error

  claude-runtime:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '24.14.0' }
      - id: adapter
        name: Read pinned adapter commit
        run: node -e 'const fs=require("node:fs"); const pin=require("./protocol/adapter-lock.json"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "commit="+pin.commit+"\n");'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: slovx2/codex-harness-adapter
          ref: ${{ steps.adapter.outputs.commit }}
          path: adapter-source
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with: { cosign-release: v2.5.3 }
      # 适配器拒绝无沙箱降级，打包后的 --runtime-info 自检需要沙箱依赖 bubblewrap 与 socat。
      - name: Prepare Claude sandbox dependency
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install --no-install-recommends bubblewrap=0.9.0-1ubuntu0.3 socat=1.8.0.0-4ubuntu0.1
          command -v bwrap socat
      - name: Build and sign isolated Claude runtime
        run: |
          sh tools/package-claude-runtime.sh adapter-source .artifacts/claude-runtime --internal-build
          for asset in .artifacts/claude-runtime/*.tar.gz; do
            cosign sign-blob --yes --bundle "${asset}.sigstore.json" "${asset}"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: claude-runtime-linux-amd64
          path: .artifacts/claude-runtime/*
          retention-days: 7
          if-no-files-found: error
