name: Internal deployment artifacts

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 构建目标平台
        required: true
        default: linux/amd64
        type: choice
        options:
          - linux/amd64
          - linux/amd64,linux/arm64

permissions:
  contents: read

concurrency:
  group: internal-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - id: image
        name: Resolve internal deployment image
        shell: bash
        env:
          IMAGE_TARGET: control
        run: |
          version="deploy-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}-${IMAGE_TARGET}"
          {
            echo "repository=${image}"
            echo "tag=${image}:${version}"
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"
          echo "### ${IMAGE_TARGET}: ${version}" >> "${GITHUB_STEP_SUMMARY}"
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          target: control
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.image.outputs.tag }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=internal-control
          cache-to: type=gha,mode=max,scope=internal-control
      - name: Record immutable digest
        env:
          IMAGE: ${{ steps.image.outputs.repository }}
          VERSION: ${{ steps.image.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "${IMAGE}:${VERSION} → ${IMAGE}@${DIGEST}" >> "${GITHUB_STEP_SUMMARY}"
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with: { cosign-release: v2.5.3 }
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: ${{ steps.image.outputs.repository }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Sign image manifest
        env:
          IMAGE: ${{ steps.image.outputs.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  host-worker:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: { go-version: "1.26.5", cache: true }
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with: { cosign-release: v2.5.3 }
      - name: Build Linux amd64 host Worker
        shell: bash
        run: |
          version="deploy-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          asset="tyrs-hand-worker_${version}_linux_amd64.tar.gz"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w -buildid= -X github.com/slovx2/tyrs-hand/internal/worker.workerVersion=${version}" \
            -o tyrs-hand-worker ./cmd/tyrs-hand-worker
          tar -czf "${asset}" tyrs-hand-worker deploy/worker
          sha256sum "${asset}" > "${asset}.sha256"
          cosign sign-blob --yes --bundle "${asset}.sigstore.json" "${asset}"
          echo "### host-worker: ${version}" >> "${GITHUB_STEP_SUMMARY}"
          cat "${asset}.sha256" >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: host-worker-linux-amd64
          path: |
            tyrs-hand-worker_*.tar.gz
            tyrs-hand-worker_*.tar.gz.sha256
            tyrs-hand-worker_*.tar.gz.sigstore.json
          retention-days: 30
          if-no-files-found: error
