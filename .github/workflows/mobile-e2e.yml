name: Mobile E2E

on:
  pull_request:
    paths:
      - client/**
      - tools/mobile-e2e/**
      - internal/httpapi/**
      - internal/codexcontrol/**
      - internal/hostworker/**
      - protocol/adapter-lock.json
      - .github/workflows/mobile-e2e.yml
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      platform:
        description: 要运行的平台
        required: true
        type: choice
        default: both
        options: [android, ios, both]

permissions:
  contents: read

concurrency:
  group: mobile-e2e-${{ github.ref }}-${{ inputs.platform || github.event_name }}
  cancel-in-progress: false

env:
  GO_VERSION: 1.26.6
  NODE_VERSION: 24.14.0
  PNPM_VERSION: 11.14.0
  MAESTRO_VERSION: 2.3.0
  ANDROID_COMMAND_LINE_TOOLS_VERSION: "19.0"
  TYRS_HAND_ADAPTER_ROOT: ${{ github.workspace }}/.local/mobile-adapter

jobs:
  android-phone:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'both' || inputs.platform == 'android'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: { go-version: "1.26.6", cache: true }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "24.14.0" }
      - name: 安装精确工具链
        run: |
          npm install --global pnpm@11.14.0 @openai/codex@0.147.0
          echo "TYRS_HAND_TEST_CODEX_BIN=$(command -v codex)" >> "${GITHUB_ENV}"
          ./tools/mobile-e2e/install-maestro.sh
      - id: adapter
        name: 读取固定适配器提交
        run: node -e 'require("fs").appendFileSync(process.env.GITHUB_OUTPUT,"commit="+require("./protocol/adapter-lock.json").commit+"\n")'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: slovx2/claude-codex
          ref: ${{ steps.adapter.outputs.commit }}
          path: .local/mobile-adapter
      - name: 安装SDK并验证网络隔离预检
        run: |
          mkdir -p .artifacts/mobile-runtime
          exec > >(tee .artifacts/mobile-runtime/preflight.log) 2>&1
          npm ci --prefix .local/mobile-adapter
          npm ci --prefix tools/protocol-inventory
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install --no-install-recommends bubblewrap=0.9.0-1ubuntu0.3 socat=1.8.0.0-4ubuntu0.1
          command -v unshare ip ssh ssh-keygen docker bwrap socat
          # sysfs 可能仍挂载在宿主网络命名空间，使用 netlink 查询当前命名空间。
          # 内层 sh 负责展开命令替换，不能在宿主 shell 提前展开。
          # shellcheck disable=SC2016
          unshare --user --map-root-user --net sh -ec '
            ip link set lo up
            ip -j link | jq -e "length == 1 and .[0].ifname == \"lo\""
            test -z "$(ip route show)"
            test -z "$(ip -6 route show default)"
          '
          make test-mobile-runtime-e2e > .artifacts/mobile-runtime/runtime-junit.xml
      - name: 创建 Android 35 手机模拟器
        timeout-minutes: 15
        run: |
          test -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          { yes || true; } | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "cmdline-tools;${ANDROID_COMMAND_LINE_TOOLS_VERSION}"
          export PATH="${ANDROID_HOME}/cmdline-tools/${ANDROID_COMMAND_LINE_TOOLS_VERSION}/bin:${ANDROID_HOME}/platform-tools:${ANDROID_HOME}/emulator:${PATH}"
          printf '%s\n' "${ANDROID_HOME}/cmdline-tools/${ANDROID_COMMAND_LINE_TOOLS_VERSION}/bin" \
            "${ANDROID_HOME}/platform-tools" "${ANDROID_HOME}/emulator" >> "${GITHUB_PATH}"
          test "$(sdkmanager --version)" = "${ANDROID_COMMAND_LINE_TOOLS_VERSION}"
          sdkmanager "platform-tools" "platforms;android-35" "system-images;android-35;google_apis;x86_64"
          # runner 的旧 ANDROID_SDK_HOME 与新版 avdmanager 的默认目录可能不同。
          # 创建和启动共用显式目录，启动前检查 ini，不能等待不存在的设备。
          export ANDROID_USER_HOME="${RUNNER_TEMP}/tyrs-hand-android"
          export ANDROID_AVD_HOME="${ANDROID_USER_HOME}/avd"
          mkdir -p "${ANDROID_AVD_HOME}"
          echo no | avdmanager create avd --force --name tyrs_hand_e2e_api35 \
            --package "system-images;android-35;google_apis;x86_64" --device "pixel_7"
          test -f "${ANDROID_AVD_HOME}/tyrs_hand_e2e_api35.ini"
          emulator -list-avds | grep -Fx tyrs_hand_e2e_api35
          sudo chmod 666 /dev/kvm
          nohup emulator -avd tyrs_hand_e2e_api35 -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect >"${RUNNER_TEMP}/android-emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'cat "${RUNNER_TEMP}/android-emulator.log"' ERR
          timeout 300 adb wait-for-device
          boot_deadline=$((SECONDS + 300))
          until [[ "$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; do
            kill -0 "${emulator_pid}"
            test "${SECONDS}" -lt "${boot_deadline}"
            sleep 2
          done
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: 安装客户端依赖
        run: pnpm --dir client install --frozen-lockfile
      - name: Android 真实双SSH、SDK与计划审批GUI
        env:
          TYRS_HAND_E2E_MAESTRO_BIN: /home/runner/.local/bin/maestro
        run: make client-e2e-android
      - name: 上传失败证据
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-e2e-android-${{ github.run_id }}
          include-hidden-files: true
          path: |
            .local/e2e/evidence/
            .artifacts/mobile-runtime/
            ${{ runner.temp }}/android-emulator.log
            !**/bin/**
            !**/worker/tyrs-hand-worker
            !**/postgres/**
          if-no-files-found: error
          retention-days: 14

  iphone:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'both' || inputs.platform == 'ios'
    runs-on: macos-15
    timeout-minutes: 120
    env:
      TYRS_HAND_E2E_NATIVE_SERVICES: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: { go-version: "1.26.6", cache: true }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "24.14.0" }
      - name: 安装并验证精确工具链
        run: |
          npm install --global pnpm@11.14.0 @openai/codex@0.147.0
          gem install cocoapods --version 1.16.2 --no-document
          test "$(pod _1.16.2_ --version)" = 1.16.2
          echo "TYRS_HAND_TEST_CODEX_BIN=$(command -v codex)" >> "${GITHUB_ENV}"
          ./tools/mobile-e2e/install-maestro.sh
          bash ./tools/mobile-e2e/install-native-services.sh
      - id: adapter
        name: 读取固定适配器提交
        run: node -e 'require("fs").appendFileSync(process.env.GITHUB_OUTPUT,"commit="+require("./protocol/adapter-lock.json").commit+"\n")'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: slovx2/claude-codex
          ref: ${{ steps.adapter.outputs.commit }}
          path: .local/mobile-adapter
      - name: 安装SDK并执行真实运行时预检
        run: |
          mkdir -p .artifacts/mobile-runtime
          npm ci --prefix .local/mobile-adapter
          npm ci --prefix tools/protocol-inventory
          make test-mobile-runtime-e2e > .artifacts/mobile-runtime/runtime-junit.xml
      - name: 启动 iPhone 模拟器
        run: |
          runtime="$(xcrun simctl list runtimes available -j | \
            jq -r '.runtimes | map(select(.platform == "iOS")) | sort_by(.version) | last.identifier')"
          device_type="com.apple.CoreSimulator.SimDeviceType.iPhone-16"
          udid="$(xcrun simctl create "Tyrs Hand E2E" "${device_type}" "${runtime}")"
          xcrun simctl boot "${udid}"
          xcrun simctl bootstatus "${udid}" -b
      - name: 安装客户端依赖
        run: pnpm --dir client install --frozen-lockfile
      - name: iPhone 真实双SSH、SDK与计划审批GUI
        env:
          TYRS_HAND_E2E_MAESTRO_BIN: /Users/runner/.local/bin/maestro
        run: make client-e2e-ios
      - name: 上传失败证据
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-e2e-ios-${{ github.run_id }}
          include-hidden-files: true
          path: |
            .local/e2e/evidence/
            .artifacts/mobile-runtime/
            client/.e2e-build/ios/signing-diagnostics/*.json
            !**/bin/**
            !**/worker/tyrs-hand-worker
            !**/postgres/**
          if-no-files-found: error
          retention-days: 14

  complete-mobile-acceptance:
    name: Android 与 iOS 完整移动验收
    if: always()
    needs: [android-phone, iphone]
    runs-on: ubuntu-24.04
    steps:
      - name: 拒绝缺失、跳过或失败的平台
        env:
          ANDROID_RESULT: ${{ needs.android-phone.result }}
          IOS_RESULT: ${{ needs.iphone.result }}
        run: |
          test "${ANDROID_RESULT}" = success
          test "${IOS_RESULT}" = success
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "24.14.0" }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mobile-e2e-*-${{ github.run_id }}
          path: .artifacts/mobile-ci
      - name: 核对真实模型、协议、客户端版本及 GUI 证据
        run: node tools/mobile-e2e/verify-evidence.mjs .artifacts/mobile-ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mobile-complete-coverage-${{ github.run_id }}
          include-hidden-files: true
          path: .artifacts/mobile-ci/mobile-coverage.json
          if-no-files-found: error
