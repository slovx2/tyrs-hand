name: Dual engine protocol acceptance

on:
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'web/**']
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'web/**']
  workflow_dispatch:
    inputs:
      macos_worker:
        description: 恢复 macOS Worker 专项验收（默认暂缓）
        type: boolean
        required: false
        default: false

permissions:
  contents: read

# 同一分支的新提交取消旧验收；只有最新提交需要完整结果。
concurrency:
  group: protocol-${{ github.ref }}
  cancel-in-progress: true

env:
  # 各分片共用同一 runId，汇总作业据此合并执行记录与通信证据。
  PROTOCOL_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  macos-loopback-comparison:
    # 2026-09-28 用户要求暂缓 macOS Worker 验收，集中完成 Linux；保留诊断入口。
    if: github.event_name == 'workflow_dispatch' && inputs.macos_worker
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.14.0'
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: go.sum
      - name: Compare loopback sandbox on macOS 15
        run: node tools/protocol-macos-loopback.mjs
      - name: Preserve loopback comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-15-loopback
          path: .artifacts/protocol/macos-loopback
          if-no-files-found: error
          retention-days: 7

  control-runtime:
    name: protocol (control)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.14.0'
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: go.sum
      - name: Control runtime isolation, automation and migration
        run: make test-control-runtime
      - id: adapter
        name: Read pinned adapter for Control E2E
        run: node -e 'const fs=require("node:fs"); const pin=require("./protocol/adapter-lock.json"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "commit="+pin.commit+"\n");'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: slovx2/codex-harness-adapter
          ref: ${{ steps.adapter.outputs.commit }}
          path: .local/protocol-adapter
      - name: Install native SDK and CLI
        run: |
          npm install --global @openai/codex@0.157.1
          npm ci --prefix .local/protocol-adapter
          npm ci --prefix .local/protocol-adapter/packages/claude
          npm ci --prefix .local/protocol-adapter/packages/pi
          sh tools/install-test-claude.sh
          npm ci --prefix tools/protocol-inventory
      - name: Verify Control evidence gates
        run: |
          npm test --prefix tools/protocol-inventory
          node --test tools/protocol-postgres-diagnostics.test.mjs
      - name: Enable isolated test network namespace
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install --no-install-recommends bubblewrap=0.9.0-1ubuntu0.3 socat=1.8.0.0-4ubuntu0.1
      - name: Real Control, SSH, SDK and automation after Worker restart
        env:
          TYRS_HAND_ADAPTER_ROOT: ${{ github.workspace }}/.local/protocol-adapter
          PROTOCOL_SHARD: control
        run: make test-control-runtime-e2e
      - name: Preserve shard coverage inputs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protocol-shard-control
          path: |
            .artifacts/protocol/runs/*/run.json
            .artifacts/protocol/runs/*/executions.jsonl
            .artifacts/protocol/runs/*/runtime-failures.json
            .artifacts/protocol/runs/*/wire-*.json
            .artifacts/protocol/runs/*/fault-injection-*.json
          if-no-files-found: error
          retention-days: 1
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protocol-evidence-control
          path: |
            .artifacts/control-runtime
            .artifacts/protocol
          if-no-files-found: warn
          retention-days: 7

  protocol:
    name: protocol (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [ssh-1, ssh-2, migration, recovery-adapter]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tyrs-hand
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: tyrs-hand
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.14.0'
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: tyrs-hand/go.sum
      - id: adapter
        name: Read pinned adapter commit
        run: node -e 'const fs=require("node:fs"); const pin=require("./protocol/adapter-lock.json"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "commit="+pin.commit+"\n");'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: slovx2/codex-harness-adapter
          ref: ${{ steps.adapter.outputs.commit }}
          path: tyrs-hand/adapter-source
      - name: Install exact dependencies
        run: |
          npm install --global @openai/codex@0.157.1
          npm ci --prefix adapter-source
          npm ci --prefix adapter-source/packages/claude
          npm ci --prefix adapter-source/packages/pi
          sh tools/install-test-claude.sh
          npm ci --prefix tools/protocol-inventory
          go mod download
      - name: Verify coverage gate itself
        if: matrix.shard == 'recovery-adapter'
        run: |
          npm test --prefix tools/protocol-inventory
          node --test tools/protocol-migration-matrix.test.mjs tools/protocol-migration-worker.test.mjs tools/protocol-recovery-matrix.test.mjs tools/protocol-recovery-title.test.mjs tools/protocol-postgres-diagnostics.test.mjs tools/protocol-macos-diagnostics.test.mjs tools/protocol-merge-shards.test.mjs
      - name: Prepare Linux sandbox dependencies
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install --no-install-recommends bubblewrap=0.9.0-1ubuntu0.3 socat=1.8.0.0-4ubuntu0.1
          command -v unshare ip bwrap socat docker
      - name: Real Codex recorder shutdown boundaries
        if: matrix.shard == 'recovery-adapter'
        run: |
          TYRS_HAND_TEST_CODEX_NATIVE_BIN=$(node --input-type=module - <<'JS'
          import { execFileSync } from 'node:child_process';
          import { createRequire } from 'node:module';
          import { dirname, resolve } from 'node:path';
          const root = execFileSync('npm', ['root', '-g'], { encoding: 'utf8' }).trim();
          const require = createRequire(resolve(root, '@openai/codex/package.json'));
          const packagePath = require.resolve(`@openai/codex-${process.platform}-${process.arch}/package.json`);
          console.log(resolve(dirname(packagePath), 'vendor', 'x86_64-unknown-linux-musl', 'bin/codex'));
          JS
          )
          export TYRS_HAND_TEST_CODEX_NATIVE_BIN
          unshare --user --map-root-user --net /bin/sh -ec 'ip link set lo up; exec node --test tools/mobile-e2e/record-runtime-native-check.mjs'
      - name: Protocol matrix shard with real Control and Docker databases
        env:
          PROTOCOL_SHARD: ${{ matrix.shard }}
        run: make test-protocol-matrix
      - name: Preserve shard coverage inputs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protocol-shard-${{ matrix.shard }}
          path: |
            tyrs-hand/.artifacts/protocol/runs/*/run.json
            tyrs-hand/.artifacts/protocol/runs/*/executions.jsonl
            tyrs-hand/.artifacts/protocol/runs/*/runtime-failures.json
            tyrs-hand/.artifacts/protocol/runs/*/wire-*.json
            tyrs-hand/.artifacts/protocol/runs/*/fault-injection-*.json
          if-no-files-found: error
          retention-days: 1
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protocol-evidence-${{ matrix.shard }}
          path: tyrs-hand/.artifacts/protocol
          if-no-files-found: warn
          retention-days: 7

  protocol-gate:
    name: 完整协议覆盖率门禁
    needs: [control-runtime, protocol]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.14.0'
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: go.sum
      - run: npm ci --prefix tools/protocol-inventory
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: protocol-shard-*
          path: .artifacts/protocol-shards
      - name: Merge shards and compute complete protocol coverage
        env:
          PROTOCOL_SHARDS: control,ssh-1,ssh-2,migration,recovery-adapter
        run: |
          target=".artifacts/protocol/runs/${PROTOCOL_RUN_ID}"
          status=0
          node tools/protocol-merge-shards.mjs .artifacts/protocol-shards "${target}" || status=1
          PROTOCOL_ARTIFACT_DIR="${target}" node tools/protocol-inventory/inventory.mjs || status=1
          exit "${status}"
      - name: Preserve protocol summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protocol-summary
          path: |
            .artifacts/protocol/runs/*/run.json
            .artifacts/protocol/runs/*/executions.jsonl
            .artifacts/protocol/runs/*/runtime-failures.json
            .artifacts/protocol/runs/*/coverage.json
          if-no-files-found: warn
          retention-days: 14
      - name: Reject failed or missing shards
        env:
          CONTROL_RESULT: ${{ needs.control-runtime.result }}
          PROTOCOL_RESULT: ${{ needs.protocol.result }}
        run: |
          test "${CONTROL_RESULT}" = success
          test "${PROTOCOL_RESULT}" = success

  macos-worker:
    # 用户要求恢复 macOS Worker 验收时手动开启；默认不调度。
    if: github.event_name == 'workflow_dispatch' && inputs.macos_worker
    runs-on: macos-14
    timeout-minutes: 40
    defaults:
      run:
        working-directory: tyrs-hand
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: tyrs-hand
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.14.0'
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: tyrs-hand/go.sum
      - id: adapter
        name: Read pinned adapter commit
        run: node -e 'const fs=require("node:fs"); const pin=require("./protocol/adapter-lock.json"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "commit="+pin.commit+"\n");'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: slovx2/codex-harness-adapter
          ref: ${{ steps.adapter.outputs.commit }}
          path: tyrs-hand/adapter-source
      - name: Install exact dependencies
        run: |
          npm install --global @openai/codex@0.157.1
          npm ci --prefix adapter-source
          npm ci --prefix adapter-source/packages/claude
          npm ci --prefix adapter-source/packages/pi
          sh tools/install-test-claude.sh
          go mod download
      - name: Diagnose macOS loopback sandbox behavior
        run: node tools/protocol-macos-loopback.mjs
      - name: macOS native SSH and command permissions
        run: make test-runtime-e2e
      - name: macOS native SDK contracts and Mock LLM
        env:
          PROTOCOL_ARTIFACT_DIR: ${{ github.workspace }}/tyrs-hand/.artifacts/protocol/macos-sdk
          CODEX_SCHEMA_DIR: ${{ github.workspace }}/tyrs-hand/protocol/codex-app-server/0.157.1/json-schema
        run: npm run test:protocol --prefix adapter-source
      - name: Preserve macOS evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protocol-macos-14
          path: tyrs-hand/.artifacts/protocol
          if-no-files-found: warn
          retention-days: 7
