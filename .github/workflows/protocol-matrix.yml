name: Dual engine protocol acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.14.0'
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: go.sum
      - name: Control runtime isolation, automation and migration
        run: make test-control-runtime
      - name: Preserve Control acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: control-runtime
          path: .artifacts/control-runtime
          if-no-files-found: error
  protocol:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tyrs-hand
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: tyrs-hand
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.14.0'
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: tyrs-hand/go.sum
      - id: adapter
        name: Read pinned adapter commit
        run: node -e 'const fs=require("node:fs"); const pin=require("./protocol/adapter-lock.json"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "commit="+pin.commit+"\n");'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: slovx2/claude-codex
          ref: ${{ steps.adapter.outputs.commit }}
          path: claude-codex
      - name: Install exact dependencies
        run: |
          npm install --global @openai/codex@0.147.0
          npm ci --prefix ../claude-codex
          npm ci --prefix tools/protocol-inventory
          go mod download
      - name: Verify coverage gate itself
        run: npm test --prefix tools/protocol-inventory
      - name: Real SSH, SDK and Mock LLM protocol matrix
        run: make test-protocol-matrix
      - name: Preserve failure and coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protocol-${{ matrix.os }}
          path: tyrs-hand/.artifacts/protocol
          if-no-files-found: error
