name: Dual engine protocol acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      macos_worker:
        description: 恢复 macOS Worker 专项验收（默认暂缓）
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  macos-loopback-comparison:
    # 2026-09-28 用户要求暂缓 macOS Worker 验收，集中完成 Linux；保留诊断入口及历史证据。
    if: github.event_name == 'workflow_dispatch' && inputs.macos_worker
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.14.0'
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: go.sum
      - name: Compare loopback sandbox on macOS 15
        run: node tools/protocol-macos-loopback.mjs
      - name: Preserve loopback comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-15-loopback
          path: .artifacts/protocol/macos-loopback
          if-no-files-found: error
  control-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.14.0'
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: go.sum
      - name: Control runtime isolation, automation and migration
        run: make test-control-runtime
      - id: adapter
        name: Read pinned adapter for Control E2E
        run: node -e 'const fs=require("node:fs"); const pin=require("./protocol/adapter-lock.json"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "commit="+pin.commit+"\n");'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: slovx2/claude-codex
          ref: ${{ steps.adapter.outputs.commit }}
          path: .local/protocol-adapter
      - name: Install native SDK and CLI
        run: |
          npm install --global @openai/codex@0.157.1
          npm ci --prefix .local/protocol-adapter
          npm ci --prefix tools/protocol-inventory
      - name: Verify Control evidence gates
        run: |
          npm test --prefix tools/protocol-inventory
          node --test tools/protocol-postgres-diagnostics.test.mjs
      - name: Enable isolated test network namespace
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install --no-install-recommends bubblewrap=0.9.0-1ubuntu0.3 socat=1.8.0.0-4ubuntu0.1
      - name: Real Control, SSH, SDK and automation after Worker restart
        env:
          TYRS_HAND_ADAPTER_ROOT: ${{ github.workspace }}/.local/protocol-adapter
        run: make test-control-runtime-e2e
      - name: Preserve Control acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: control-runtime
          path: |
            .artifacts/control-runtime
            .artifacts/protocol
          if-no-files-found: error
      - name: Preserve compact Control summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: control-runtime-summary
          path: |
            .artifacts/protocol/latest.json
            .artifacts/protocol/runs/*/run.json
            .artifacts/protocol/runs/*/combination.json
            .artifacts/protocol/runs/*/runtime-failures.json
            .artifacts/protocol/runs/*/executions.jsonl
            .artifacts/protocol/runs/*/runtime-wire.json
            .artifacts/protocol/runs/*/postgres-diagnostics.json
          if-no-files-found: warn
  protocol:
    strategy:
      fail-fast: false
      matrix:
        # 默认仅 Linux；用户要求恢复后可手动显式开启 macOS Worker 验收。
        os: ${{ fromJSON(inputs.macos_worker && '["ubuntu-24.04", "macos-14"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tyrs-hand
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: tyrs-hand
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.14.0'
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: tyrs-hand/go.sum
      - id: adapter
        name: Read pinned adapter commit
        run: node -e 'const fs=require("node:fs"); const pin=require("./protocol/adapter-lock.json"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "commit="+pin.commit+"\n");'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: slovx2/claude-codex
          ref: ${{ steps.adapter.outputs.commit }}
          path: claude-codex
      - name: Install exact dependencies
        run: |
          npm install --global @openai/codex@0.157.1
          npm ci --prefix ../claude-codex
          npm ci --prefix tools/protocol-inventory
          go mod download
      - name: Verify coverage gate itself
        run: |
          npm test --prefix tools/protocol-inventory
          node --test tools/protocol-migration-matrix.test.mjs tools/protocol-migration-worker.test.mjs tools/protocol-recovery-matrix.test.mjs tools/protocol-recovery-title.test.mjs tools/protocol-postgres-diagnostics.test.mjs tools/protocol-macos-diagnostics.test.mjs
      - name: Prepare Linux sandbox dependencies
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install --no-install-recommends bubblewrap=0.9.0-1ubuntu0.3 socat=1.8.0.0-4ubuntu0.1
          command -v unshare ip bwrap socat docker
      - name: Real Codex recorder shutdown boundaries
        run: |
          TYRS_HAND_TEST_CODEX_NATIVE_BIN=$(node --input-type=module - <<'JS'
          import { execFileSync } from 'node:child_process';
          import { createRequire } from 'node:module';
          import { dirname, resolve } from 'node:path';
          const root = execFileSync('npm', ['root', '-g'], { encoding: 'utf8' }).trim();
          const require = createRequire(resolve(root, '@openai/codex/package.json'));
          const packagePath = require.resolve(`@openai/codex-${process.platform}-${process.arch}/package.json`);
          const target = { 'darwin-arm64': 'aarch64-apple-darwin', 'linux-x64': 'x86_64-unknown-linux-musl' }[`${process.platform}-${process.arch}`];
          if (!target) throw new Error('未登记的 CI 原生平台');
          console.log(resolve(dirname(packagePath), 'vendor', target, 'bin/codex'));
          JS
          )
          export TYRS_HAND_TEST_CODEX_NATIVE_BIN
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            unshare --user --map-root-user --net /bin/sh -ec 'ip link set lo up; exec node --test tools/mobile-e2e/record-runtime-native-check.mjs'
          else
            sandbox-exec -p '(version 1)(allow default)(deny network-outbound)(allow network-outbound (remote ip "localhost:*") (remote unix-socket))' node --test tools/mobile-e2e/record-runtime-native-check.mjs
          fi
      - name: Complete protocol matrix with real Control and Docker databases
        if: runner.os == 'Linux'
        run: make test-protocol-matrix
      # macOS 专项入口暂时保留但不调度；当前完整协议及数据库门禁由 Linux 执行。
      - name: Diagnose macOS loopback sandbox behavior
        if: runner.os == 'macOS'
        run: node tools/protocol-macos-loopback.mjs
      - name: macOS native SSH and command permissions
        if: runner.os == 'macOS'
        run: make test-runtime-e2e
      - name: macOS native SDK contracts and Mock LLM
        if: runner.os == 'macOS'
        env:
          PROTOCOL_ARTIFACT_DIR: ${{ github.workspace }}/tyrs-hand/.artifacts/protocol/macos-sdk
          CODEX_SCHEMA_DIR: ${{ github.workspace }}/tyrs-hand/protocol/codex-app-server/0.157.1/json-schema
        run: npm run test:protocol --prefix ../claude-codex
      - name: Preserve failure and coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protocol-${{ matrix.os }}
          path: tyrs-hand/.artifacts/protocol
          if-no-files-found: error
      - name: Preserve compact protocol summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protocol-summary-${{ matrix.os }}
          path: |
            tyrs-hand/.artifacts/protocol/latest.json
            tyrs-hand/.artifacts/protocol/runs/*/run.json
            tyrs-hand/.artifacts/protocol/runs/*/combination.json
            tyrs-hand/.artifacts/protocol/runs/*/runtime-failures.json
            tyrs-hand/.artifacts/protocol/runs/*/executions.jsonl
            tyrs-hand/.artifacts/protocol/runs/*/postgres-diagnostics.json
            tyrs-hand/.artifacts/protocol/runs/*/coverage.json
          if-no-files-found: warn
