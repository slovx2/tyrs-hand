name: Release host Worker binaries

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  worker-binaries:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
          - { os: darwin, arch: amd64 }
          - { os: darwin, arch: arm64 }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: { go-version: "1.26.5", cache: true }
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with: { cosign-release: v2.5.3 }
      - name: Validate exact release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: '[[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - name: Build thin Worker binary
        shell: bash
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          asset="tyrs-hand-worker_${version}_${GOOS}_${GOARCH}.tar.gz"
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -buildid= -X github.com/slovx2/tyrs-hand/internal/worker.workerVersion=${version}" \
            -o tyrs-hand-worker ./cmd/tyrs-hand-worker
          tar -czf "${asset}" tyrs-hand-worker deploy/worker
          sha256sum "${asset}" > "${asset}.sha256"
          cosign sign-blob --yes --bundle "${asset}.sigstore.json" "${asset}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: worker-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            tyrs-hand-worker_*.tar.gz
            tyrs-hand-worker_*.tar.gz.sha256
            tyrs-hand-worker_*.tar.gz.sigstore.json

  publish:
    runs-on: ubuntu-24.04
    needs: worker-binaries
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { pattern: worker-*, merge-multiple: true }
      - name: Attach Worker binaries to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${RELEASE_TAG}" tyrs-hand-worker_*.tar.gz* --clobber
