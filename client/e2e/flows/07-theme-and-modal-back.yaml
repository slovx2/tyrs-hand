appId: ${TYRS_HAND_E2E_APP_ID}
---
- runFlow:
    when:
      visible:
        id: "session:back"
    commands:
      - tapOn:
          id: "session:back"
- tapOn:
    id: "tab:connections"
- tapOn:
    id: "theme:dark"
- tapOn:
    id: "connection:.*:rename"
    index: 0
- pressKey: BACK
- assertVisible:
    id: "connection:active"
- tapOn:
    id: "theme:light"
- tapOn:
    id: "theme:system"
