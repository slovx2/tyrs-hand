appId: ${TYRS_HAND_E2E_APP_ID}
---
- launchApp:
    clearState: false
- runFlow: _shared/go-root.yaml
- tapOn:
    id: "tab:projects"
- tapOn:
    id: "project:row:0"
- tapOn:
    id: "composer:attachments"
- tapOn:
    id: "composer:attachment:document"
- tapOn:
    point: 7%, 7%
- tapOn:
    id: "android:id/title"
    text: "Downloads"
- tapOn: "tyrs-hand-e2e.txt"
- extendedWaitUntil:
    visible:
      id: "composer:attachment:0"
    timeout: 30000
- tapOn:
    id: "composer:input"
- inputText: "E2E_OFFLINE_ATTACHMENT_IDEMPOTENT"
- tapOn:
    id: "composer:send"
- extendedWaitUntil:
    visible:
      id: "outbox:.*:failed"
    timeout: 30000
- stopApp
