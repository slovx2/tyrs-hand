appId: ${TYRS_HAND_E2E_APP_ID}
---
- runFlow:
    when:
      visible:
        id: "session:back"
    commands:
      - tapOn:
          id: "session:back"
- tapOn:
    id: "tab:connections"
- tapOn:
    id: "connection:inactive"
- tapOn:
    id: "tab:projects"
- tapOn:
    id: "project:row:0"
- tapOn:
    id: "composer:parameters"
- tapOn:
    id: "parameters:mode:plan"
- tapOn:
    id: "parameters:done"
- runFlow:
    file: _shared/create-task.yaml
    env:
      TASK_TEXT: "E2E_SECRET require desktop only"
- extendedWaitUntil:
    visible:
      id: "interactive:.*:secret"
    timeout: 120000
- assertNotVisible:
    id: "interactive:.*:submit"
- tapOn:
    id: "session:stop"
- extendedWaitUntil:
    notVisible:
      id: "session:stop"
    timeout: 60000
- tapOn:
    id: "session:back"
- tapOn:
    id: "tab:connections"
- tapOn:
    id: "connection:inactive"
- runFlow:
    file: _shared/create-task.yaml
    env:
      TASK_TEXT: "E2E_FAIL_429 deterministic failure"
- extendedWaitUntil:
    visible:
      id: "run:error"
    timeout: 120000
