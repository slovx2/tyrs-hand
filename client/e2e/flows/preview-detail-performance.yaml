appId: ${APP_ID}
---
# 使用 EXPO_PUBLIC_TYRS_HAND_PREVIEW_STRESS=true 的 Release 包，只在模拟器运行。
- launchApp
- extendedWaitUntil:
    visible:
      id: "session:30000000-0000-4000-8000-000000000010"
    timeout: 30000
- tapOn:
    id: "session:30000000-0000-4000-8000-000000000010"
- assertVisible: "LONG_CONVERSATION_LATEST"
- takeScreenshot: "long-conversation-latest"
- tapOn:
    id: "session:back"
- scrollUntilVisible:
    element:
      id: "session:30000000-0000-4000-8000-000000000012"
    direction: DOWN
- tapOn:
    id: "session:30000000-0000-4000-8000-000000000012"
- assertVisible: "1000 个工具处理完成"
- assertNotVisible:
    id: "tool-group:stress-tool-0"
- takeScreenshot: "1000-tools-collapsed"
- tapOn:
    id: "turn:stress-tools:activity-toggle"
- extendedWaitUntil:
    visible:
      id: "tool-group:stress-tool-0"
    timeout: 10000
- assertVisible: "加载更多过程"
- tapOn: "加载更多过程"
- assertVisible: "加载更多过程"
- takeScreenshot: "1000-tools-two-pages"
- tapOn:
    id: "turn:stress-tools:activity-toggle"
- assertNotVisible:
    id: "tool-group:stress-tool-0"
- tapOn:
    id: "session:back"
- scrollUntilVisible:
    element:
      id: "session:30000000-0000-4000-8000-000000000013"
    direction: DOWN
- tapOn:
    id: "session:30000000-0000-4000-8000-000000000013"
- extendedWaitUntil:
    visible: "(?s).*LONG_MARKDOWN_END.*"
    timeout: 15000
- takeScreenshot: "100k-markdown-latest"
- tapOn:
    id: "session:back"
- scrollUntilVisible:
    element:
      id: "session:30000000-0000-4000-8000-000000000011"
    direction: UP
- tapOn:
    id: "session:30000000-0000-4000-8000-000000000011"
- extendedWaitUntil:
    visible: "第 500 轮最终回答"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "第 490 轮最终回答"
    direction: UP
    timeout: 30000
- takeScreenshot: "500-turns-history"
- tapOn:
    id: "session:back"
- tapOn:
    id: "session:30000000-0000-4000-8000-000000000011"
- extendedWaitUntil:
    visible: "第 500 轮最终回答"
    timeout: 15000
- takeScreenshot: "500-turns-reopen"
