appId: ${TYRS_HAND_E2E_APP_ID}
---
- launchApp:
    clearState: true
- assertVisible:
    id: "projects:list"
- tapOn:
    id: "project:row:0"
- assertVisible:
    id: "sessions:list"
- assertVisible:
    text: "运行中：完善移动端会话体验"
- tapOn:
    id: "project:new-task:add"
- tapOn:
    id: "composer:parameters"
- assertVisible:
    id: "parameters:model:gpt-5.6-sol"
- pressKey: BACK
- tapOn:
    id: "composer:input"
- inputText: "PREVIEW_DIRECT_NAVIGATION"
- tapOn:
    id: "composer:send"
- extendedWaitUntil:
    visible:
      id: "messages:list"
    timeout: 10000
- assertVisible:
    text: "PREVIEW_DIRECT_NAVIGATION"
- tapOn:
    id: "session:back"

# 官方运行中 Turn
- scrollUntilVisible:
    element:
      id: "session:30000000-0000-4000-8000-000000000001"
    direction: DOWN
- tapOn:
    id: "session:30000000-0000-4000-8000-000000000001"
- assertVisible:
    id: "session:stop"
- assertVisible: "正在运行命令"
- assertVisible:
    id: "tool-group:shimmer"
- assertNotVisible: "PREVIEW_TOOL_OUTPUT_MUST_NOT_RENDER"
- extendedWaitUntil:
    visible: "最终回答开始后，处理过程应当已经自动收起。"
    timeout: 20000
- assertVisible:
    id: "turn:turn-running:activity-toggle"
- assertNotVisible: "我正在读取官方 Thread 与 Turn 状态。"
- tapOn:
    id: "turn:turn-running:activity-toggle"
- assertVisible: "我正在读取官方 Thread 与 Turn 状态。"
- tapOn:
    id: "tool-group:command-running-1:toggle"
- assertVisible: "已运行 pnpm test -- --runInBand"
- assertNotVisible: "STREAMING_OUTPUT_MUST_NOT_RENDER"
- tapOn:
    id: "session:back"

# 最新完成 Turn 中的 Plan Item
- scrollUntilVisible:
    element:
      id: "session:30000000-0000-4000-8000-000000000002"
    direction: DOWN
- tapOn:
    id: "session:30000000-0000-4000-8000-000000000002"
- scrollUntilVisible:
    element:
      id: "plan:execute"
    direction: DOWN
- assertVisible:
    id: "plan:execute"
- tapOn:
    id: "session:back"

# 官方 Server Request
- scrollUntilVisible:
    element:
      id: "session:30000000-0000-4000-8000-000000000003"
    direction: DOWN
- tapOn:
    id: "session:30000000-0000-4000-8000-000000000003"
- scrollUntilVisible:
    element:
      id: "interactive:option:0"
    direction: DOWN
- assertVisible:
    id: "interactive:input:scope"
- tapOn:
    id: "session:back"

# 官方失败 Turn
- scrollUntilVisible:
    element:
      id: "session:30000000-0000-4000-8000-000000000005"
    direction: DOWN
- tapOn:
    id: "session:30000000-0000-4000-8000-000000000005"
- assertVisible:
    id: "turn:error"
- tapOn:
    id: "session:back"

# 官方 Agent Item 与 Markdown
- scrollUntilVisible:
    element:
      id: "session:30000000-0000-4000-8000-000000000009"
    direction: DOWN
- tapOn:
    id: "session:30000000-0000-4000-8000-000000000009"
- assertVisible:
    id: "message:role:agent"
- assertVisible:
    text: ".*唯一顺序来源.*"
- tapOn:
    id: "session:back"

# 32 个 Turn 的官方分页：首屏在最新，上翻按页加载，回到最新不依赖全量读取
- scrollUntilVisible:
    element:
      id: "session:30000000-0000-4000-8000-000000000010"
    direction: DOWN
- tapOn:
    id: "session:30000000-0000-4000-8000-000000000010"
- assertVisible:
    text: "LONG_CONVERSATION_LATEST"
- scrollUntilVisible:
    element:
      text: "长会话第 16 轮"
    direction: UP
    timeout: 40000
    centerElement: true
    waitToSettleTimeoutMs: 500
- tapOn:
    id: "turn:turn-long-16:activity-toggle"
- assertVisible:
    id: "tool-group:command-long-16"
- tapOn:
    id: "tool-group:command-long-16:toggle"
- assertVisible: "已运行 pnpm test -- --runInBand"
- assertNotVisible: "LONG_TOOL_OUTPUT_MUST_NOT_RENDER"
- assertVisible:
    id: "chat:scroll-to-latest"
- tapOn:
    id: "chat:scroll-to-latest"
- assertVisible:
    text: "LONG_CONVERSATION_LATEST"
- tapOn:
    id: "session:back"

# 归档与独立连接
- tapOn:
    id: "sessions:filter:archived"
- assertVisible:
    id: "session:row:0"
- tapOn:
    id: "project:back"
- tapOn:
    id: "tab:connections"
- assertVisible:
    id: "connection:active"
- assertVisible:
    id: "connection:inactive"
- tapOn:
    id: "theme:dark"
- tapOn:
    id: "connection:.*:rename"
    index: 0
- assertVisible:
    id: "connection:rename:input"
- pressKey: BACK
- tapOn:
    id: "connection:add"
- assertVisible:
    id: "connection:scanner"
- assertVisible:
    text: "预览模式相机画面"
- pressKey: BACK
- tapOn:
    id: "theme:system"
