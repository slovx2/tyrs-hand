appId: ${TYRS_HAND_E2E_APP_ID}
---
- launchApp:
    clearState: true
- assertVisible:
    id: "projects:list"
- assertVisible:
    text: "Tyrs Hand 移动客户端"
- tapOn:
    id: "project:row:0"
- assertVisible:
    id: "sessions:list"
- assertVisible:
    text: "运行中：完善移动端会话体验"
- tapOn:
    id: "project:new-task:add"
- tapOn:
    id: "composer:parameters"
- assertVisible:
    id: "parameters:model:gpt-5.6-luna"
- pressKey: BACK
- pressKey: BACK
- tapOn:
    id: "tab:sessions"
- assertVisible:
    id: "session:row:0"

# 运行中、实时事件与失败 Outbox
- tapOn:
    id: "session:row:0"
- tapOn:
    id: "session:more"
- assertVisible:
    id: "session:stop"
- pressKey: BACK
- scrollUntilVisible:
    element:
      id: "run:.*:progress"
    direction: DOWN
- assertVisible:
    id: "run:live"
- assertVisible:
    id: "outbox:preview-message-failed:failed"
- pressKey: BACK

# 已完成计划
- tapOn:
    id: "session:row:1"
- assertVisible:
    id: "run:activity:toggle"
- tapOn:
    id: "run:activity:toggle"
- scrollUntilVisible:
    element:
      id: "run:operations:1:toggle"
    direction: DOWN
- tapOn:
    id: "run:operations:1:toggle"
- assertVisible:
    text: ".*已运行命令.*"
- tapOn:
    id: "run:activity:toggle"
- scrollUntilVisible:
    element:
      id: "plan:execute"
    direction: DOWN
- assertVisible:
    id: "plan:execute"
- pressKey: BACK

# 普通交互问答
- scrollUntilVisible:
    element:
      id: "session:row:2"
    direction: DOWN
- tapOn:
    id: "session:row:2"
- scrollUntilVisible:
    element:
      id: "interactive:option:0"
    direction: DOWN
- assertVisible:
    id: "interactive:option:0"
- pressKey: BACK

# 敏感信息问题
- scrollUntilVisible:
    element:
      id: "session:row:3"
    direction: DOWN
- tapOn:
    id: "session:row:3"
- scrollUntilVisible:
    element:
      id: "interactive:.*:secret"
    direction: DOWN
- assertVisible:
    text: ".*请在 Codex 桌面端完成.*"
- pressKey: BACK

# 失败任务
- scrollUntilVisible:
    element:
      id: "session:row:4"
    direction: DOWN
- tapOn:
    id: "session:row:4"
- tapOn:
    id: "run:activity:toggle"
- scrollUntilVisible:
    element:
      id: "run:error"
    direction: DOWN
- assertVisible:
    id: "run:error"
- pressKey: BACK

# Markdown 与附件
- scrollUntilVisible:
    element:
      id: "session:row:5"
    direction: DOWN
- tapOn:
    id: "session:row:5"
- assertVisible:
    text: "图片 · mobile-layout.png"
- assertVisible:
    text: "文件 · acceptance-report.md"
- pressKey: BACK

# Markdown 完整排版与中间过程卡片
- scrollUntilVisible:
    element:
      id: "session:row:6"
    direction: DOWN
- tapOn:
    id: "session:row:6"
- assertVisible:
    text: "Markdown 排版验收"
- assertVisible:
    text: ".*粗体.*斜体.*"
- scrollUntilVisible:
    element:
      text: "表格"
    direction: DOWN
- assertVisible:
    text: "completed"
- scrollUntilVisible:
    element:
      id: "run:activity:toggle"
    direction: DOWN
- tapOn:
    id: "run:activity:toggle"
- assertVisible:
    text: "已完成"
- assertVisible:
    text: ".*Markdown 容器宽度.*"
- pressKey: BACK

# 归档列表与恢复入口
- tapOn:
    id: "sessions:filter:archived"
- assertVisible:
    id: "session:row:0"
- tapOn:
    id: "session:row:0"
- assertVisible:
    id: "session:restore"
- pressKey: BACK

# 多连接、主题、重命名和扫码弹层
- tapOn:
    id: "tab:connections"
- assertVisible:
    id: "connection:active"
- assertVisible:
    id: "connection:inactive"
- tapOn:
    id: "theme:dark"
- tapOn:
    id: "connection:.*:rename"
    index: 0
- assertVisible:
    id: "connection:rename:input"
- pressKey: BACK
- tapOn:
    id: "connection:add"
- assertVisible:
    id: "connection:scanner"
- assertVisible:
    text: "预览模式相机画面"
- pressKey: BACK
- tapOn:
    id: "theme:system"
