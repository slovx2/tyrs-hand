appId: ${TYRS_HAND_E2E_APP_ID}
---
- launchApp:
    clearState: true
- assertVisible:
    id: "projects:list"
- assertVisible:
    text: "Tyrs Hand 移动客户端"
- tapOn:
    id: "project:row:0"
- assertVisible:
    id: "sessions:list"
- assertVisible:
    text: "运行中：完善移动端会话体验"
- tapOn:
    id: "project:new-task:add"
- tapOn:
    id: "composer:parameters"
- assertVisible:
    id: "parameters:model:gpt-5.6-sol"
- pressKey: BACK
- tapOn:
    id: "composer:input"
- inputText: "PREVIEW_DIRECT_NAVIGATION"
- tapOn:
    id: "composer:send"
- extendedWaitUntil:
    visible:
      id: "messages:list"
    timeout: 10000
- assertVisible:
    text: "PREVIEW_DIRECT_NAVIGATION"
- tapOn:
    id: "session:back"

# 官方运行中 Turn
- tapOn:
    id: "session:row:0"
- assertVisible:
    id: "session:stop"
- tapOn:
    id: "session:back"

# 最新完成 Turn 中的 Plan Item
- tapOn:
    id: "session:row:1"
- scrollUntilVisible:
    element:
      id: "plan:execute"
    direction: DOWN
- assertVisible:
    id: "plan:execute"
- tapOn:
    id: "session:back"

# 官方 Server Request
- scrollUntilVisible:
    element:
      id: "session:row:2"
    direction: DOWN
- tapOn:
    id: "session:row:2"
- scrollUntilVisible:
    element:
      id: "interactive:option:0"
    direction: DOWN
- assertVisible:
    id: "interactive:input:scope"
- tapOn:
    id: "session:back"

# 官方失败 Turn
- scrollUntilVisible:
    element:
      id: "session:row:3"
    direction: DOWN
- tapOn:
    id: "session:row:3"
- assertVisible:
    id: "turn:error"
- tapOn:
    id: "session:back"

# 官方 Agent Item 与 Markdown
- scrollUntilVisible:
    element:
      id: "session:row:4"
    direction: DOWN
- tapOn:
    id: "session:row:4"
- assertVisible:
    id: "message:role:agent"
- assertVisible:
    text: ".*唯一顺序来源.*"
- tapOn:
    id: "session:back"

# 归档与独立连接
- tapOn:
    id: "sessions:filter:archived"
- assertVisible:
    id: "session:row:0"
- tapOn:
    id: "tab:connections"
- assertVisible:
    id: "connection:active"
- assertVisible:
    id: "connection:inactive"
- tapOn:
    id: "theme:dark"
- tapOn:
    id: "connection:.*:rename"
    index: 0
- assertVisible:
    id: "connection:rename:input"
- pressKey: BACK
- tapOn:
    id: "connection:add"
- assertVisible:
    id: "connection:scanner"
- assertVisible:
    text: "预览模式相机画面"
- pressKey: BACK
- tapOn:
    id: "theme:system"
