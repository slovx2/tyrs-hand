appId: ${TYRS_HAND_E2E_APP_ID}
---
- launchApp:
    clearState: true
- assertVisible:
    id: "projects:list"
- assertVisible:
    text: "Tyrs Hand 移动客户端"
- tapOn:
    id: "project:row:0"
- tapOn:
    id: "composer:parameters"
- assertVisible:
    id: "parameters:model:gpt-5.6-luna"
- pressKey: BACK
- tapOn:
    id: "tab:sessions"
- assertVisible:
    id: "session:row:0"

# 运行中、实时事件与失败 Outbox
- tapOn:
    id: "session:row:0"
- assertVisible:
    id: "session:stop"
- scrollUntilVisible:
    element:
      id: "run:.*:progress"
    direction: DOWN
- assertVisible:
    id: "run:live"
- assertVisible:
    id: "outbox:preview-message-failed:failed"
- pressKey: BACK

# 已完成 Plan
- tapOn:
    id: "session:row:1"
- scrollUntilVisible:
    element:
      id: "plan:execute"
    direction: DOWN
- assertVisible:
    id: "plan:execute"
- pressKey: BACK

# 普通交互问答
- scrollUntilVisible:
    element:
      id: "session:row:2"
    direction: DOWN
- tapOn:
    id: "session:row:2"
- scrollUntilVisible:
    element:
      id: "interactive:option:0"
    direction: DOWN
- assertVisible:
    id: "interactive:option:0"
- pressKey: BACK

# Secret 问题
- scrollUntilVisible:
    element:
      id: "session:row:3"
    direction: DOWN
- tapOn:
    id: "session:row:3"
- scrollUntilVisible:
    element:
      id: "interactive:.*:secret"
    direction: DOWN
- assertVisible:
    text: ".*只能在 Codex Desktop 完成.*"
- pressKey: BACK

# 失败 Run
- scrollUntilVisible:
    element:
      id: "session:row:4"
    direction: DOWN
- tapOn:
    id: "session:row:4"
- scrollUntilVisible:
    element:
      id: "run:error"
    direction: DOWN
- assertVisible:
    id: "run:error"
- pressKey: BACK

# Markdown 与附件
- scrollUntilVisible:
    element:
      id: "session:row:5"
    direction: DOWN
- tapOn:
    id: "session:row:5"
- assertVisible:
    text: "图片 · mobile-layout.png"
- assertVisible:
    text: "文件 · acceptance-report.md"
- pressKey: BACK

# 归档列表与恢复入口
- tapOn:
    id: "sessions:filter:archived"
- assertVisible:
    id: "session:row:0"
- tapOn:
    id: "session:row:0"
- assertVisible:
    id: "session:restore"
- pressKey: BACK

# 多 Control、主题、重命名和扫码弹层
- tapOn:
    id: "tab:connections"
- assertVisible:
    id: "connection:active"
- assertVisible:
    id: "connection:inactive"
- tapOn:
    id: "theme:dark"
- tapOn:
    id: "connection:.*:rename"
    index: 0
- assertVisible:
    id: "connection:rename:input"
- pressKey: BACK
- tapOn:
    id: "connection:add"
- assertVisible:
    id: "connection:scanner"
- assertVisible:
    text: "预览模式相机画面"
- pressKey: BACK
- tapOn:
    id: "theme:system"
