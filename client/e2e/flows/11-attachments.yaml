appId: ${TYRS_HAND_E2E_APP_ID}
---
- runFlow:
    when:
      visible:
        id: "project:back"
    commands:
      - tapOn:
          id: "project:back"
- tapOn:
    id: "tab:projects"
- tapOn:
    id: "project:row:0"
- tapOn:
    id: "composer:attachments"
- tapOn:
    id: "composer:attachment:library"
- runFlow:
    when:
      platform: Android
      visible: "Cloud media app"
    commands:
      - tapOn: "None"
      - pressKey: BACK
      - tapOn:
          id: "composer:attachments"
      - tapOn:
          id: "composer:attachment:library"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "com.google.android.providers.media.module:id/icon_thumbnail"
          index: 0
      - tapOn:
          id: "com.google.android.providers.media.module:id/button_add"
- runFlow:
    when:
      platform: iOS
      visible: "Add"
    commands:
      - tapOn:
          point: 18%, 28%
      - tapOn: "Add"
- extendedWaitUntil:
    visible:
      id: "composer:attachment:0"
    timeout: 30000
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: "composer:attachments"
      - tapOn:
          id: "composer:attachment:document"
      - tapOn:
          point: 7%, 7%
      - tapOn:
          id: "android:id/title"
          text: "Downloads"
      - tapOn: "tyrs-hand-e2e.txt"
      - extendedWaitUntil:
          visible:
            id: "composer:attachment:1"
          timeout: 30000
- tapOn:
    id: "composer:input"
- inputText: "E2E_BASIC_ATTACHMENT verify image and file"
- tapOn:
    id: "composer:send"
- extendedWaitUntil:
    visible:
      id: "session:row:0"
    timeout: 30000
- tapOn:
    id: "session:row:0"
- extendedWaitUntil:
    visible:
      id: "message:role:agent"
    timeout: 120000
