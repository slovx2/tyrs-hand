appId: ${TYRS_HAND_E2E_APP_ID}
---
- runFlow:
    when:
      visible:
        id: "project:back"
    commands:
      - tapOn:
          id: "project:back"
- tapOn:
    id: "tab:connections"
- tapOn:
    id: "connection:inactive"
- tapOn:
    id: "tab:projects"
- tapOn:
    id: "project:row:0"
- tapOn:
    id: "composer:parameters"
- tapOn:
    id: "parameters:mode:plan"
- tapOn:
    id: "parameters:done"
- runFlow:
    file: _shared/create-task.yaml
    env:
      TASK_TEXT: "E2E_ASK_MATRIX options and free text"
- extendedWaitUntil:
    visible:
      id: "interactive:option:0"
    timeout: 120000
- tapOn:
    id: "interactive:input:scope"
- inputText: "custom implementation scope"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "interactive:input:note"
    direction: DOWN
- tapOn:
    id: "interactive:input:note"
- inputText: "mobile free text answer"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "interactive:.*:submit"
    direction: DOWN
- tapOn:
    id: "interactive:.*:submit"
- extendedWaitUntil:
    visible:
      id: "message:intent-result.*"
    timeout: 120000
- assertVisible: ".*交互闭环完成.*"
- assertNotVisible:
    id: "interactive:.*:submit"
