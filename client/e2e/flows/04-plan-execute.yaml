appId: ${TYRS_HAND_E2E_APP_ID}
---
- runFlow:
    when:
      visible:
        id: "session:back"
    commands:
      - tapOn:
          id: "session:back"
- runFlow:
    when:
      visible:
        id: "project:back"
    commands:
      - tapOn:
          id: "project:back"
- tapOn:
    id: "tab:projects"
- tapOn:
    id: "project:row:0"
- tapOn:
    id: "project:new-task:add"
- tapOn:
    id: "composer:parameters"
- tapOn:
    id: "parameters:mode:plan"
- tapOn:
    id: "parameters:done"
- tapOn:
    id: "composer:input"
- inputText: "E2E_PLAN prepare deterministic plan"
- tapOn:
    id: "composer:send"
- extendedWaitUntil:
    visible:
      id: "messages:list"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "plan:execute"
    timeout: 120000
- tapOn:
    id: "plan:execute"
- extendedWaitUntil:
    notVisible:
      id: "plan:execute"
    timeout: 120000
