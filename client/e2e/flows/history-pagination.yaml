appId: ${TYRS_HAND_E2E_APP_ID}
---
- launchApp:
    clearState: false
- runFlow: _shared/go-root.yaml
- tapOn:
    id: "tab:sessions"
- tapOn:
    id: "session:row:0"
- extendedWaitUntil:
    visible:
      id: "message:history-180"
    timeout: 60000
- repeat:
    times: 45
    commands:
      - swipe:
          start: 50%, 25%
          end: 50%, 90%
          duration: 250
- extendedWaitUntil:
    visible:
      id: "message:history-001"
    timeout: 60000
- assertVisible:
    id: "chat:scroll-to-latest"
- tapOn:
    id: "chat:scroll-to-latest"
- extendedWaitUntil:
    visible:
      id: "message:history-180"
    timeout: 30000
- assertNotVisible:
    id: "chat:scroll-to-latest"
- stopApp
