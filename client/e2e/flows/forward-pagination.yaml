appId: ${TYRS_HAND_E2E_APP_ID}
---
- launchApp:
    clearState: false
- runFlow: _shared/go-root.yaml
- tapOn:
    id: "tab:sessions"
- tapOn:
    id: "session:row:0"
- extendedWaitUntil:
    visible:
      id: "message:forward-125"
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "message:forward-001"
    direction: UP
    timeout: 60000
