appId: ${TYRS_HAND_E2E_APP_ID}
---
- launchApp:
    clearState: false
- tapOn:
    id: "tab:projects"
- tapOn:
    id: "project:row:0"
- tapOn:
    id: "project:new-task:add"
- tapOn:
    id: "composer:attachments"
- tapOn:
    id: "composer:attachment:camera"
- tapOn:
    point: 50%, 88%
- tapOn:
    point: 88%, 90%
- extendedWaitUntil:
    visible:
      id: "composer:attachment:0"
    timeout: 30000
