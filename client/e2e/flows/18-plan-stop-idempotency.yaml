appId: ${TYRS_HAND_E2E_APP_ID}
---
- runFlow:
    when:
      visible:
        id: "session:back"
    commands:
      - tapOn:
          id: "session:back"
- runFlow:
    when:
      visible:
        id: "project:back"
    commands:
      - tapOn:
          id: "project:back"
- tapOn:
    id: "tab:projects"
- tapOn:
    id: "project:row:0"
- tapOn:
    id: "project:new-task:add"
- tapOn:
    id: "composer:parameters"
- tapOn:
    id: "parameters:mode:plan"
- tapOn:
    id: "parameters:done"
- runFlow:
    file: _shared/create-task.yaml
    env:
      TASK_TEXT: "E2E_PLAN_IDEMPOTENT prepare one plan intent"
- extendedWaitUntil:
    visible:
      id: "plan:execute"
    timeout: 120000
- tapOn:
    id: "plan:execute"
- extendedWaitUntil:
    notVisible:
      id: "plan:execute"
    timeout: 120000
- runFlow:
    file: _shared/create-task.yaml
    env:
      TASK_TEXT: "E2E_BLOCK_IDEMPOTENT accept one stop intent"
- extendedWaitUntil:
    visible:
      id: "session:more"
    timeout: 120000
- tapOn:
    id: "session:more"
- extendedWaitUntil:
    visible:
      id: "session:stop"
    timeout: 30000
- tapOn:
    id: "session:stop"
- extendedWaitUntil:
    notVisible:
      id: "session:stop"
    timeout: 60000
