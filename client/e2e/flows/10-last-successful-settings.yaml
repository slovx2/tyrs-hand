appId: ${TYRS_HAND_E2E_APP_ID}
---
- runFlow:
    when:
      visible:
        id: "session:back"
    commands:
      - tapOn:
          id: "session:back"
- runFlow:
    when:
      visible:
        id: "project:back"
    commands:
      - tapOn:
          id: "project:back"
- tapOn:
    id: "tab:projects"
- tapOn:
    id: "project:row:0"
- tapOn:
    id: "composer:parameters"
- assertVisible:
    id: "parameters:mode:plan:selected"
- assertVisible:
    id: "parameters:tier:fast:selected"
- tapOn:
    id: "parameters:done"
