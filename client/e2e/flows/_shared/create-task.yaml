appId: ${TYRS_HAND_E2E_APP_ID}
---
- runFlow:
    when:
      visible:
        id: "session:back"
    commands:
      - tapOn:
          id: "session:back"
- runFlow:
    when:
      visible:
        id: "project:back"
    commands:
      - tapOn:
          id: "project:back"
- tapOn:
    id: "tab:projects"
- extendedWaitUntil:
    visible:
      id: "project:row:0"
    timeout: 60000
- tapOn:
    id: "project:row:0"
- tapOn:
    id: "composer:input"
- inputText: ${TASK_TEXT}
- tapOn:
    id: "composer:send"
- extendedWaitUntil:
    visible:
      id: "session:row:0"
    timeout: 30000
- tapOn:
    id: "session:row:0"
