      responses: { "204": { description: Thread 已绑定 }, default: { $ref: "#/components/responses/Problem" } }
  /worker/v1/runs/{id}/submission:
    servers: [{ url: / }]
    post:
      tags: [Worker Protocol]
      operationId: workerRecordSubmission
      security: [{ workerBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkerResourceID" }]
      requestBody: { $ref: "#/components/requestBodies/WorkerJSON" }
      responses: { "204": { description: Submission 已记录 }, default: { $ref: "#/components/responses/Problem" } }
  /worker/v1/runs/{id}/confirm:
    servers: [{ url: / }]
    post:
      tags: [Worker Protocol]
      operationId: workerConfirmTurn
      security: [{ workerBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkerResourceID" }]
      requestBody: { $ref: "#/components/requestBodies/WorkerJSON" }
      responses: { "204": { description: Turn 已确认 }, default: { $ref: "#/components/responses/Problem" } }
  /worker/v1/runs/{id}/workspace-project-state:
    servers: [{ url: / }]
    post:
      tags: [Worker Protocol]
      operationId: workerWorkspaceProjectState
      security: [{ workerBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkerResourceID" }]
      requestBody: { $ref: "#/components/requestBodies/WorkerJSON" }
      responses: { "204": { description: 项目状态已保存 }, default: { $ref: "#/components/responses/Problem" } }
  /worker/v1/runs/{id}/workspace-state:
    servers: [{ url: / }]
    post:
      tags: [Worker Protocol]
      operationId: workerWorkspaceState
      security: [{ workerBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkerResourceID" }]
      requestBody: { $ref: "#/components/requestBodies/WorkerJSON" }
      responses: { "204": { description: Workspace 状态已保存 }, default: { $ref: "#/components/responses/Problem" } }
  /worker/v1/runs/{id}/tools/call:
    servers: [{ url: / }]
    post:
      tags: [Worker Protocol]
      operationId: workerToolCall
      security: [{ workerBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkerResourceID" }]
      requestBody: { $ref: "#/components/requestBodies/WorkerJSON" }
      responses: { "200": { $ref: "#/components/responses/WorkerJSON" }, default: { $ref: "#/components/responses/Problem" } }
  /worker/v1/runs/{id}/git-credential:
    servers: [{ url: / }]
    post:
      tags: [Worker Protocol]
      operationId: workerGitCredential
      security: [{ workerBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkerResourceID" }]
      requestBody: { $ref: "#/components/requestBodies/WorkerJSON" }
      responses: { "200": { $ref: "#/components/responses/WorkerJSON" }, default: { $ref: "#/components/responses/Problem" } }
  /worktrees:
    get: { $ref: "#/components/pathItems/ListWorktrees" }
  /audit-logs:
    get: { $ref: "#/components/pathItems/ListAuditLogs" }
  /installations:
    get: { $ref: "#/components/pathItems/ListInstallations" }
  /repo-caches:
    get: { $ref: "#/components/pathItems/ListRepoCaches" }
  /system/status:
    get:
      operationId: getSystemStatus
      tags: [Resources]
      responses:
        "200":
          description: 系统状态
          content:
            application/json:
              schema: { type: object, additionalProperties: { type: integer, format: int64 } }
        default: { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: tyrs_hand_session
    workerBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-worker-credential
    clientBearer:
      type: http
      scheme: bearer
      bearerFormat: tdv1-device-credential
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    WorkerResourceID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  requestBodies:
    WorkerJSON:
      required: true
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
  responses:
    Problem:
      description: RFC 9457 Problem Details
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    ResourceList:
      description: 游标分页资源列表
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ResourceList" }
    WorkerJSON:
      description: Worker 直连协议响应
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
  pathItems:
    ListRepositories:
      operationId: listRepositories
      tags: [Resources]
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses: { "200": { $ref: "#/components/responses/ResourceList" }, default: { $ref: "#/components/responses/Problem" } }
    ListAgentProfiles:
      operationId: listAgentProfiles
      tags: [Resources]
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses: { "200": { $ref: "#/components/responses/ResourceList" }, default: { $ref: "#/components/responses/Problem" } }
    ListTriggerRules:
      operationId: listTriggerRules
      tags: [Resources]
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses: { "200": { $ref: "#/components/responses/ResourceList" }, default: { $ref: "#/components/responses/Problem" } }
    ListWorkItems:
      operationId: listWorkItems
      tags: [Resources]
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses: { "200": { $ref: "#/components/responses/ResourceList" }, default: { $ref: "#/components/responses/Problem" } }
    ListThreads:
      operationId: listThreads
      tags: [Resources]
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses: { "200": { $ref: "#/components/responses/ResourceList" }, default: { $ref: "#/components/responses/Problem" } }
    ListJobs:
      operationId: listJobs
      tags: [Resources]
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses: { "200": { $ref: "#/components/responses/ResourceList" }, default: { $ref: "#/components/responses/Problem" } }
    ListWorktrees:
      operationId: listWorktrees
      tags: [Resources]
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses: { "200": { $ref: "#/components/responses/ResourceList" }, default: { $ref: "#/components/responses/Problem" } }
    ListAuditLogs:
      operationId: listAuditLogs
      tags: [Resources]
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses: { "200": { $ref: "#/components/responses/ResourceList" }, default: { $ref: "#/components/responses/Problem" } }
    ListInstallations:
      operationId: listInstallations
      tags: [Resources]
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses: { "200": { $ref: "#/components/responses/ResourceList" }, default: { $ref: "#/components/responses/Problem" } }
    ListRepoCaches:
      operationId: listRepoCaches
      tags: [Resources]
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses: { "200": { $ref: "#/components/responses/ResourceList" }, default: { $ref: "#/components/responses/Problem" } }
    CreateGeneric:
      tags: [Resources]
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IDResource" }
        default: { $ref: "#/components/responses/Problem" }
  schemas:
    ClientModel:
      type: object
      required: [id, displayName, description, supportedReasoningEfforts,
        defaultReasoningEffort, isDefault]
      properties:
        id: { type: string }
        model: { type: string }
        displayName: { type: string }
        description: { type: string }
        supportedReasoningEfforts:
          type: array
          items:
            type: object
            required: [reasoningEffort, description]
            properties:
              reasoningEffort: { type: string, minLength: 1 }
              description: { type: string }
        defaultReasoningEffort: { type: string, minLength: 1 }
        inputModalities: { type: array, items: { type: string } }
        additionalSpeedTiers: { type: array, items: { type: string } }
        serviceTiers:
          type: array
          items:
            type: object
            required: [id, name, description]
            properties:
              id: { type: string }
              name: { type: string }
              description: { type: string }
        defaultServiceTier: { type: string, nullable: true }
        isDefault: { type: boolean }
        hidden: { type: boolean }
    Worker:
      type: object
      required: [id, name, roles, enabled, maxConcurrentJobs, protocolVersion, status, metadata]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        roles: { type: array, items: { type: string, enum: [github, discord] } }
        enabled: { type: boolean }
        maxConcurrentJobs: { type: integer, minimum: 1 }
        protocolVersion: { type: integer }
        workerVersion: { type: string }
        status: { type: string, enum: [pending, online, offline, disabled, incompatible, error] }
        heartbeatAt: { type: string, format: date-time }
        lastError: { type: string }
        sshHostKeyFingerprint: { type: string, pattern: '^SHA256:[A-Za-z0-9+/]{43}$' }
        metadata: { type: object, additionalProperties: true }
    WorkerInput:
      type: object
      required: [name, roles, maxConcurrentJobs]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        roles: { type: array, minItems: 1, items: { type: string, enum: [github, discord] } }
        maxConcurrentJobs: { type: integer, minimum: 1 }
    EnrollmentToken:
      type: object
      required: [enrollmentToken, expiresIn]
      properties:
        enrollmentToken: { type: string, writeOnly: true }
        expiresIn: { type: integer, enum: [900] }
    WorkerCreated:
      allOf:
        - { $ref: "#/components/schemas/EnrollmentToken" }
        - type: object
          required: [worker]
          properties: { worker: { $ref: "#/components/schemas/Worker" } }
    WorkerDefaults:
      type: object
      properties:
        githubWorkerId: { type: string, format: uuid, nullable: true }
        discordWorkerId: { type: string, format: uuid, nullable: true }
    ClientMachine:
      type: object
      required: [workerId, name, sshHostKeyFingerprint, status, approvedAt]
      properties:
        workerId: { type: string, format: uuid }
        name: { type: string }
        sshHostKeyFingerprint: { type: string, pattern: '^SHA256:[A-Za-z0-9+/]{43}$' }
        status: { type: string }
        heartbeatAt: { type: string, format: date-time }
        workspaceId: { type: string, format: uuid }
        approvedAt: { type: string, format: date-time }
    ClientMachineList:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: "#/components/schemas/ClientMachine" } } }
    ClientDevice:
      type: object
      required: [id, name, platform, createdAt, approvedAt, machines]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        platform: { type: string }
        createdAt: { type: string, format: date-time }
        approvedAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        machines: { type: array, items: { $ref: "#/components/schemas/ClientMachine" } }
    ClientDeviceList:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: "#/components/schemas/ClientDevice" } } }
    ClientPairingCreateInput:
      type: object
      required: [workerId]
      properties: { workerId: { type: string, format: uuid } }
    ClientPairingClaimInput:
      type: object
      required: [pairingSecret, deviceId, name, platform, credentialHash]
      properties:
        pairingSecret: { type: string }
        deviceId: { type: string, format: uuid }
        name: { type: string, maxLength: 120 }
        platform: { type: string, maxLength: 40 }
        credentialHash: { type: string, minLength: 64, maxLength: 64 }
    ClientPairing:
      type: object
      required: [id, status, workerId, workerName, sshHostKeyFingerprint, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [waiting_scan, waiting_confirmation, approved, rejected, expired] }
        deviceId: { type: string, format: uuid }
        deviceName: { type: string }
        platform: { type: string }
        workerId: { type: string, format: uuid }
        workerName: { type: string }
        sshHostKeyFingerprint: { type: string, pattern: '^SHA256:[A-Za-z0-9+/]{43}$' }
        pairingUri: { type: string }
        qrDataUrl: { type: string }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    ClientScheduledTaskSession:
      type: object
      required: [id, title]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        externalThreadId: { type: string }
    ClientScheduledTask:
      type: object
      required: [id, workspaceId, kind, name, prompt, status, schedule, timezone,
        scheduleKind, scheduleRevision, project, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        kind: { type: string, enum: [standalone, heartbeat] }
        name: { type: string }
        prompt: { type: string }
        status: { type: string, enum: [active, paused, completed, deleted] }
        schedule: { type: string }
        timezone: { type: string }
        scheduleKind: { type: string, enum: [interval, wall_clock] }
        intervalSeconds: { type: integer, format: int64 }
        nextRunAt: { type: string, format: date-time }
        blockedUntil: { type: string, format: date-time }
        lastRunAt: { type: string, format: date-time }
        scheduleRevision: { type: integer, format: int64 }
        lastErrorCode: { type: string }
        lastErrorMessage: { type: string }
        project: { type: object, additionalProperties: true }
        targetSession: { $ref: "#/components/schemas/ClientScheduledTaskSession" }
        standaloneSettings: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ClientScheduledTaskList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ClientScheduledTask" } }
        nextCursor: { type: string }
    ClientScheduledTaskRun:
      type: object
      required: [id, scheduleRevision, trigger, triggerKey, scheduledFor, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        scheduleRevision: { type: integer, format: int64 }
        trigger: { type: string, enum: [scheduled, run_now] }
        triggerKey: { type: string }
        scheduledFor: { type: string, format: date-time }
        coalescedThrough: { type: string, format: date-time }
        status: { type: string, enum: [queued, running, waiting_for_user, succeeded, failed, canceled] }
        errorCode: { type: string }
        errorMessage: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        session: { $ref: "#/components/schemas/ClientScheduledTaskSession" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ClientScheduledTaskRunList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ClientScheduledTaskRun" } }
        nextCursor: { type: string }
    SSHCredential:
      type: object
      required: [id, name, publicKey, fingerprint, enabled, version, hostCount, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        publicKey: { type: string, readOnly: true }
        fingerprint: { type: string, readOnly: true }
        enabled: { type: boolean }
        version: { type: integer, format: int64, readOnly: true }
        hostCount: { type: integer, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
    SSHCredentialList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SSHCredential" } }
    SSHCredentialCreateInput:
      type: object
      required: [name, privateKey, enabled]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        privateKey: { type: string, minLength: 1, writeOnly: true }
        passphrase: { type: string, writeOnly: true }
        enabled: { type: boolean }
    SSHCredentialUpdateInput:
      type: object
      required: [name, enabled]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        privateKey:
          type: string
          writeOnly: true
          description: 非空时显式轮换私钥；空字符串表示保持现有私钥
        passphrase: { type: string, writeOnly: true }
        enabled: { type: boolean }
    SSHHost:
      type: object
      required: [id, alias, hostname, port, username, credentialId, credentialName, workerIds, enabled, updatedAt]
      properties:
        id: { type: string, format: uuid }
        alias: { type: string }
        hostname: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        username: { type: string }
        credentialId: { type: string, format: uuid }
        credentialName: { type: string, readOnly: true }
        proxyJumpHostId: { type: string, format: uuid }
        proxyJumpAlias: { type: string, readOnly: true }
        workerIds: { type: array, items: { type: string, format: uuid } }
        enabled: { type: boolean }
        updatedAt: { type: string, format: date-time, readOnly: true }
    SSHHostInput:
      type: object
      required: [alias, hostname, port, username, credentialId, workerIds, enabled]
      properties:
        alias: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9._-]+$" }
        hostname: { type: string, minLength: 1, maxLength: 255 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        username: { type: string, minLength: 1, maxLength: 128 }
        credentialId: { type: string, format: uuid }
        proxyJumpHostId: { type: string, format: uuid }
        workerIds: { type: array, items: { type: string, format: uuid }, uniqueItems: true }
        enabled: { type: boolean }
    SSHHostImportItem:
      type: object
      required: [alias, hostname, port, username]
      properties:
        alias: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9._-]+$" }
        hostname: { type: string, minLength: 1, maxLength: 255 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        username: { type: string, minLength: 1, maxLength: 128 }
        proxyJumpAlias: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9._-]+$" }
    SSHHostImportInput:
      type: object
      required: [credentialId, workerIds, enabled, hosts]
      properties:
        credentialId: { type: string, format: uuid }
        workerIds: { type: array, items: { type: string, format: uuid }, uniqueItems: true }
        enabled: { type: boolean }
        hosts:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/SSHHostImportItem" }
    SSHHostList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SSHHost" } }
    WorkerSSHCredential:
      type: object
      required: [id, privateKey, publicKey, fingerprint]
      properties:
        id: { type: string, format: uuid }
        privateKey: { type: string, writeOnly: true }
        passphrase: { type: string, writeOnly: true }
        publicKey: { type: string }
        fingerprint: { type: string }
    WorkerSSHHost:
      type: object
      required: [alias, hostname, port, username, credentialId]
      properties:
        alias: { type: string }
        hostname: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        username: { type: string }
        credentialId: { type: string, format: uuid }
        proxyJumpAlias: { type: string }
    WorkerSSHConfiguration:
      type: object
      required: [revision, credentials, hosts]
      properties:
        revision: { type: string }
        credentials: { type: array, items: { $ref: "#/components/schemas/WorkerSSHCredential" } }
        hosts: { type: array, items: { $ref: "#/components/schemas/WorkerSSHHost" } }
    WorkerEnrollRequest:
      type: object
      required: [token]
      properties: { token: { type: string, writeOnly: true } }
    WorkerEnrollResponse:
      type: object
      required: [workerId, credential, protocolVersion]
      properties:
        workerId: { type: string, format: uuid }
        credential: { type: string, writeOnly: true }
        protocolVersion: { type: integer }
    WorkerHeartbeat:
      type: object
      required: [workerVersion, protocolVersion, sshHostKeyFingerprint]
      properties:
        workerVersion: { type: string }
        protocolVersion: { type: integer }
        sshHostKeyFingerprint: { type: string, pattern: '^SHA256:[A-Za-z0-9+/]{43}$' }
        metadata: { type: object, additionalProperties: true }
    WorkerClaimRequest:
      type: object
      required: [role, wait]
      properties:
        role: { type: string, enum: [all, github, discord] }
        wait: { type: boolean }
    WorkerClaimResponse:
      type: object
      properties:
        task: { type: object, additionalProperties: true }
    WorkerSessionTitleTask:
      type: object
      required: [id, sessionId, workspaceId, firstMessage, titleRevision, attempt, leaseToken, leaseExpiresAt]
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        firstMessage: { type: string, maxLength: 2000 }
        titleRevision: { type: integer, format: int64, minimum: 0 }
        attempt: { type: integer, minimum: 1, maximum: 3 }
        leaseToken: { type: string, writeOnly: true }
        leaseExpiresAt: { type: string, format: date-time }
    WorkerSessionTitleClaimResponse:
      type: object
      properties:
        task: { $ref: "#/components/schemas/WorkerSessionTitleTask" }
    WorkerSessionTitleCompleteRequest:
      type: object
