                ordinal: { type: integer, minimum: 0, maximum: 9 }
                file: { type: string, format: binary }
      responses:
        "200": { description: 幂等请求返回已保存的 Agent 图片, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "201": { description: Agent 图片已保存, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: "#/components/responses/Problem" }
  /worker/v1/runs/{id}/complete:
    servers: [{ url: / }]
    post:
      tags: [Worker Protocol]
      operationId: workerRunComplete
      security: [{ workerBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkerResourceID" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WorkerCompleteRequest" } } } }
      responses: { "204": { description: Run 已完成 }, default: { $ref: "#/components/responses/Problem" } }
  /worker/v1/runs/{id}/fail:
    servers: [{ url: / }]
    post:
      tags: [Worker Protocol]
      operationId: workerRunFail
      security: [{ workerBearer: [] }]
      parameters: [{ $ref: "#/components/parameters/WorkerResourceID" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WorkerFailRequest" } } } }
      responses: { "204": { description: Run 失败状态已保存 }, default: { $ref: "#/components/responses/Problem" } }
  /worker/v1/runs/{id}/thread:
    servers: [{ url: / }]
