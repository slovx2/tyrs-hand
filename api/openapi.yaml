openapi: 3.1.0
info:
  title: tyrs-hand Management API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /api/v1
tags:
  - name: Auth
  - name: GitHub
  - name: Resources
  - name: Settings
  - name: Discord
  - name: Workspaces
  - name: Workers
  - name: SSH
  - name: Worker Protocol
  - name: Client Protocol
paths:
  /webhooks/github:
    post:
      operationId: receiveGitHubWebhook
      tags: [GitHub]
      servers: [{ url: / }]
      security: []
      parameters:
        - { name: X-Hub-Signature-256, in: header, required: true, schema: { type: string } }
        - { name: X-GitHub-Delivery, in: header, required: true, schema: { type: string } }
        - { name: X-GitHub-Event, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "202":
          description: 已持久化
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        default: { $ref: "#/components/responses/Problem" }
  /internal/v1/tools/call:
    post:
      operationId: callInternalTool
      tags: [Resources]
      servers: [{ url: / }]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Tool Call 结果
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        default: { $ref: "#/components/responses/Problem" }
  /setup/status:
    get:
      operationId: getSetupStatus
      tags: [Auth]
      security: []
      responses:
        "200":
          description: Setup 状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
  /setup/admin:
    post:
      operationId: setupAdministrator
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "201":
          description: 管理员与恢复资料
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupResult" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: 登录会话
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/me:
    get:
      operationId: getCurrentAdministrator
      tags: [Auth]
      responses:
        "200":
          description: 当前管理员
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Administrator" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "204": { description: 已退出 }
        default: { $ref: "#/components/responses/Problem" }
  /github/app:
    get:
      operationId: getGitHubApp
      tags: [GitHub]
      responses:
        "200":
          description: GitHub App 状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubAppStatus" }
    put:
      operationId: putGitHubApp
      tags: [GitHub]
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GitHubAppInput" }
      responses:
        "204": { description: 已保存 }
        default: { $ref: "#/components/responses/Problem" }
  /github/app/manifest:
    get:
      operationId: getGitHubAppManifest
      tags: [GitHub]
      responses:
        "200":
          description: Manifest 表单参数
          content:
            application/json:
              schema:
                type: object
                required: [url, manifest]
                properties:
                  url: { type: string, format: uri }
                  manifest: { type: string }
  /github/app/manifest/callback:
    get:
      operationId: githubAppManifestCallback
      tags: [GitHub]
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
      responses:
        "302": { description: 返回 GitHub 设置页 }
        default: { $ref: "#/components/responses/Problem" }
  /settings/github-agent-instructions:
    get:
      operationId: getGitHubAgentInstructions
      tags: [Settings]
      responses:
        "200":
          description: 仅注入 GitHub Work Item 的 developer instructions
          content: { application/json: { schema: { $ref: "#/components/schemas/GitHubAgentInstructions" } } }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: putGitHubAgentInstructions
      tags: [Settings]
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/GitHubAgentInstructions" } } }
      responses:
        "204": { description: 已保存 }
        default: { $ref: "#/components/responses/Problem" }
  /settings/github-agent:
    get:
      operationId: listGitHubAgentSettings
      tags: [Settings]
      responses:
        "200":
          description: GitHub Agent Profile 与仓库参数覆盖
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubAgentSettingsList" }
        default: { $ref: "#/components/responses/Problem" }
  /settings/github-agent/repositories/{id}:
    put:
      operationId: putRepositoryGitHubAgentSettings
      tags: [Settings]
      parameters:
        - { $ref: "#/components/parameters/CSRFToken" }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/GitHubAgentPreferences" } } }
      responses:
        "204": { description: 已保存 }
        default: { $ref: "#/components/responses/Problem" }
  /settings/discord:
    get:
      operationId: getDiscordSettings
      tags: [Discord]
      responses:
        "200":
          description: Discord 设置
          content: { application/json: { schema: { $ref: "#/components/schemas/DiscordSettings" } } }
        default: { $ref: "#/components/responses/Problem" }
    put:
      operationId: putDiscordSettings
      tags: [Discord]
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DiscordSettingsInput" } } }
      responses:
        "204": { description: 已保存 }
        default: { $ref: "#/components/responses/Problem" }
  /discord/status:
    get:
      operationId: getDiscordStatus
      tags: [Discord]
      responses:
        "200":
          description: Discord 运行状态
          content: { application/json: { schema: { $ref: "#/components/schemas/DiscordStatus" } } }
        default: { $ref: "#/components/responses/Problem" }
  /discord/initializations/preflight:
    post:
      operationId: preflightDiscordInitialization
      tags: [Discord]
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DiscordInitializationInput" } } }
      responses:
        "200":
          description: 零修改预检结果
          content: { application/json: { schema: { $ref: "#/components/schemas/DiscordPreflight" } } }
        default: { $ref: "#/components/responses/Problem" }
  /discord/initializations:
    post:
      operationId: createDiscordInitialization
      tags: [Discord]
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DiscordInitializationInput" } } }
      responses:
        "202":
          description: 初始化已排队
          content: { application/json: { schema: { $ref: "#/components/schemas/IDResource" } } }
        default: { $ref: "#/components/responses/Problem" }
  /discord/initializations/{id}:
    get:
      operationId: getDiscordInitialization
      tags: [Discord]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 初始化状态
          content: { application/json: { schema: { $ref: "#/components/schemas/DiscordInitialization" } } }
        default: { $ref: "#/components/responses/Problem" }
  /discord/members:
    get:
      operationId: listDiscordMembers
      tags: [Discord]
      responses:
        "200":
          description: Discord 成员
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/DiscordMember" } }
        default: { $ref: "#/components/responses/Problem" }
  /workspaces:
    get:
      operationId: listWorkspaces
      tags: [Workspaces]
      responses:
        "200":
          description: Worker 与逻辑 Workspace 绑定
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createWorkspace
      tags: [Workspaces]
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ownerDiscordUserId, workerId]
              properties:
                ownerDiscordUserId: { type: string, minLength: 1 }
                workerId: { type: string, format: uuid }
      responses:
        "201":
          description: Workspace 已创建并绑定 Worker
          content: { application/json: { schema: { $ref: "#/components/schemas/IDResource" } } }
        default: { $ref: "#/components/responses/Problem" }
  /workspace-projects/{id}/forums:
    post:
      operationId: createWorkspaceProjectForum
      tags: [Workspaces]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceProjectForumInput" }
      responses:
        "202": { description: Forum 创建已排队或历史 Forum 已恢复 }
        default: { $ref: "#/components/responses/Problem" }
  /workspace-forums/{id}/disable:
    post:
      operationId: disableWorkspaceForum
      tags: [Workspaces]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "202": { description: Forum 配对已停用并切换为只读 }
        default: { $ref: "#/components/responses/Problem" }
  /workspace-forums/{id}/enable:
    post:
      operationId: enableWorkspaceForum
      tags: [Workspaces]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "202": { description: Forum 配对已恢复 }
        default: { $ref: "#/components/responses/Problem" }
  /workspace-projects/{id}/forums/{forumId}/collaborators/{memberId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: forumId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: memberId, in: path, required: true, schema: { type: string } }
    put:
      operationId: putWorkspaceProjectForumCollaborator
      tags: [Workspaces]
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accessLevel]
              properties: { accessLevel: { type: string, enum: [readonly, operator] } }
      responses:
        "204": { description: 已更新 }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteWorkspaceProjectForumCollaborator
      tags: [Workspaces]
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "204": { description: 已删除 }
        default: { $ref: "#/components/responses/Problem" }
  /discord/forums/{forumId}/access/{memberId}:
    parameters:
      - { name: forumId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: memberId, in: path, required: true, schema: { type: string } }
    put:
      operationId: putDiscordForumAccess
      tags: [Discord]
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accessLevel]
              properties: { accessLevel: { type: string, enum: [readonly, operator] } }
      responses:
        "204": { description: 已更新 }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteDiscordForumAccess
      tags: [Discord]
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      responses:
        "204": { description: 已删除 }
        default: { $ref: "#/components/responses/Problem" }
  /discord/github/bind:
    post:
      operationId: startDiscordGitHubBind
      tags: [Discord]
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [guildId, discordUserId]
              properties: { guildId: { type: string }, discordUserId: { type: string } }
      responses:
        "200":
          description: 一次性绑定链接
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties: { url: { type: string, format: uri } }
        default: { $ref: "#/components/responses/Problem" }
  /discord/github/bind/callback:
    get:
      operationId: completeDiscordGitHubBind
      tags: [Discord]
      security: []
      parameters:
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: code, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: 绑定完成 }
        default: { $ref: "#/components/responses/Problem" }
  /discord/github/unbind:
    post:
      operationId: unbindDiscordGitHub
      tags: [Discord]
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [guildId, discordUserId, confirmed]
              properties:
                guildId: { type: string }
                discordUserId: { type: string }
                confirmed: { type: boolean }
      responses:
        "204": { description: 已解绑 }
        default: { $ref: "#/components/responses/Problem" }
  /events/stream:
    get:
      operationId: streamEvents
      tags: [Resources]
      responses:
        "200":
          description: Server-Sent Events
          content:
            text/event-stream:
              schema: { type: string }
  /repositories:
    get: { $ref: "#/components/pathItems/ListRepositories" }
    post:
      operationId: createRepository
      tags: [Resources]
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RepositoryInput" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IDResource" }
        default: { $ref: "#/components/responses/Problem" }
  /agent-profiles:
    get: { $ref: "#/components/pathItems/ListAgentProfiles" }
    post: { $ref: "#/components/pathItems/CreateGeneric" }
  /trigger-rules:
    get: { $ref: "#/components/pathItems/ListTriggerRules" }
    post:
      operationId: createTriggerRule
      tags: [Resources]
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TriggerRuleInput" }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IDResource" }
        default: { $ref: "#/components/responses/Problem" }
  /work-items:
    get: { $ref: "#/components/pathItems/ListWorkItems" }
  /threads:
    get: { $ref: "#/components/pathItems/ListThreads" }
  /jobs:
    get: { $ref: "#/components/pathItems/ListJobs" }
  /workers:
    get:
      operationId: listWorkers
      tags: [Workers]
      responses:
        "200":
          description: 宿主 Worker 列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: { items: { type: array, items: { $ref: "#/components/schemas/Worker" } } }
    post:
      operationId: createWorker
      tags: [Workers]
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WorkerInput" } } }
      responses:
        "201":
          description: Worker 与一次性注册 Token
          content: { application/json: { schema: { $ref: "#/components/schemas/WorkerCreated" } } }
  /workers/{id}/enrollments:
    post:
      operationId: createWorkerEnrollment
      tags: [Workers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "201": { description: 一次性注册 Token, content: { application/json: { schema: { $ref: "#/components/schemas/EnrollmentToken" } } } }
  /workers/{id}:
    get:
      operationId: getWorker
      tags: [Workers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: 单个宿主 Worker, content: { application/json: { schema: { $ref: "#/components/schemas/Worker" } } } }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: deleteWorker
      tags: [Workers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses: { "204": { description: 已删除 }, default: { $ref: "#/components/responses/Problem" } }
  /workers/{id}/workspace:
    get:
      operationId: getWorkerWorkspace
      tags: [Workers, Workspaces]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Worker 当前绑定的 Workspace；未绑定时为 null
          content:
            application/json:
              schema:
                type: object
                required: [workspace]
                properties:
                  workspace:
                    allOf:
                      - { $ref: "#/components/schemas/Workspace" }
                    nullable: true
        default: { $ref: "#/components/responses/Problem" }
  /workers/{id}/workspace/scan:
    post:
      operationId: scanWorkerWorkspace
      tags: [Workers, Workspaces]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "200":
          description: Worker 实时扫描后的 Workspace
          content:
            application/json:
              schema:
                type: object
                required: [workspace]
                properties:
                  workspace: { $ref: "#/components/schemas/Workspace" }
        default: { $ref: "#/components/responses/Problem" }
  /workers/{id}/enabled:
    put:
      operationId: setWorkerEnabled
      tags: [Workers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CSRFToken" }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [enabled], properties: { enabled: { type: boolean } } } } } }
      responses: { "204": { description: 已更新 }, default: { $ref: "#/components/responses/Problem" } }
  /settings/workers:
    get:
      operationId: getWorkerDefaults
      tags: [Workers]
      responses: { "200": { description: 默认 Worker, content: { application/json: { schema: { $ref: "#/components/schemas/WorkerDefaults" } } } } }
    put:
      operationId: putWorkerDefaults
      tags: [Workers]
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WorkerDefaults" } } } }
      responses: { "204": { description: 已保存 }, default: { $ref: "#/components/responses/Problem" } }
  /client-devices:
    get:
      operationId: listClientDevices
      tags: [Client Protocol]
      responses:
        "200":
          description: 已授权的移动设备及机器
          content: { application/json: { schema: { $ref: "#/components/schemas/ClientDeviceList" } } }
  /client-devices/{id}:
    delete:
      operationId: deleteClientDevice
      tags: [Client Protocol]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses: { "204": { description: 设备及其全部机器授权已撤销 }, default: { $ref: "#/components/responses/Problem" } }
  /client-device-pairings:
    post:
      operationId: createClientDevicePairing
      tags: [Client Protocol]
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ClientPairingCreateInput" } } }
      responses:
        "201":
          description: 单台 Worker 的定时任务只读授权二维码
          content: { application/json: { schema: { $ref: "#/components/schemas/ClientPairing" } } }
        default: { $ref: "#/components/responses/Problem" }
  /client-device-pairings/{id}:
    get:
      operationId: getClientDevicePairing
      tags: [Client Protocol]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: 授权状态, content: { application/json: { schema: { $ref: "#/components/schemas/ClientPairing" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /client-device-pairings/{id}/approve:
    post:
      operationId: approveClientDevicePairing
      tags: [Client Protocol]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses: { "200": { description: 已确认设备 }, default: { $ref: "#/components/responses/Problem" } }
  /client-device-pairings/{id}/reject:
    post:
      operationId: rejectClientDevicePairing
      tags: [Client Protocol]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses: { "204": { description: 已拒绝 }, default: { $ref: "#/components/responses/Problem" } }
  /client/device-pairings/{id}/claim:
    post:
      operationId: claimClientDevicePairing
      tags: [Client Protocol]
      security: []
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ClientPairingClaimInput" } } }
      responses:
