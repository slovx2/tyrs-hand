        "201": { description: 原子创建会话、首条消息与 Turn, content: { application/json: { schema: { type: object, required: [session, deduplicated], properties: { session: { $ref: "#/components/schemas/ClientSession" }, deduplicated: { type: boolean } } } } } }
        default: { $ref: "#/components/responses/Problem" }
  /client/sessions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: clientGetSession
      tags: [Client Protocol]
      security: [{ clientBearer: [] }]
      responses:
        "200": { description: 会话、目标参数和当前 Run, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: clientPatchSession
      tags: [Client Protocol]
      security: [{ clientBearer: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, additionalProperties: true } }
      responses:
        "200": { description: 更新后的会话, content: { application/json: { schema: { $ref: "#/components/schemas/ClientSession" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /client/sessions/{id}/messages:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: clientListMessages
      tags: [Client Protocol]
      security: [{ clientBearer: [] }]
      parameters:
        - { name: beforeSeq, in: query, schema: { type: integer, format: int64 } }
        - { name: afterSeq, in: query, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200": { description: 双向消息分页, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: clientCreateMessage
      tags: [Client Protocol]
      security: [{ clientBearer: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, required: [localId, text], properties: { localId: { type: string }, text: { type: string }, behavior: { type: string, enum: [start_when_idle, steer_if_active] }, attachmentIds: { type: array, maxItems: 10, items: { type: string, format: uuid } } } } }
      responses:
        "201": { description: 已发送或 steer, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: "#/components/responses/Problem" }
  /client/sessions/{id}/turns:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: clientListTurns
      tags: [Client Protocol]
      security: [{ clientBearer: [] }]
      parameters:
        - { name: beforeCursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses:
        "200": { description: 按完整轮次分页的聊天历史, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: "#/components/responses/Problem" }
  /client/sessions/{id}/turns/{turnId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: turnId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: clientGetTurn
      tags: [Client Protocol]
      security: [{ clientBearer: [] }]
      responses:
        "200": { description: 单个完整轮次, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: "#/components/responses/Problem" }
  /client/runs/{runId}/segments/{segmentId}/activities:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: segmentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: clientListRunSegmentActivities
      tags: [Client Protocol]
      security: [{ clientBearer: [] }]
      parameters:
        - { name: beforeActivitySeq, in: query, schema: { type: integer, format: int64 } }
        - { name: afterEventSeq, in: query, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: Run 分段内的活动分页和流式检查点, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: "#/components/responses/Problem" }
  /client/sessions/{id}/stop:
    post:
      operationId: clientStopSession
      tags: [Client Protocol]
      security: [{ clientBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "202": { description: 操作已接受, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: "#/components/responses/Problem" }
  /client/sessions/{id}/archive:
    post:
      operationId: clientArchiveSession
      tags: [Client Protocol]
      security: [{ clientBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "202": { description: 归档请求已接受, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: "#/components/responses/Problem" }
  /client/sessions/{id}/restore:
    post:
      operationId: clientRestoreSession
      tags: [Client Protocol]
      security: [{ clientBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "202": { description: 恢复请求已接受, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: "#/components/responses/Problem" }
  /client/sessions/{id}/plans/{runId}/execute:
    post:
      operationId: clientExecutePlan
      tags: [Client Protocol]
      security: [{ clientBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "201": { description: Plan 执行 Intent, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: "#/components/responses/Problem" }
  /client/uploads:
    post:
      operationId: clientUpload
      tags: [Client Protocol]
      security: [{ clientBearer: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [localId, file]
              properties:
                localId: { type: string }
                file: { type: string, format: binary }
      responses:
        "201": { description: 已上传附件, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: "#/components/responses/Problem" }
  /client/attachments/{id}/content:
    get:
      operationId: clientDownloadAttachment
      tags: [Client Protocol]
      security: [{ clientBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: 附件内容, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        default: { $ref: "#/components/responses/Problem" }
  /client/interactive/{id}/answer:
    post:
      operationId: clientAnswerInteractive
      tags: [Client Protocol]
      security: [{ clientBearer: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, required: [answer], properties: { answer: { type: object, additionalProperties: true } } } }
      responses:
        "200": { description: 交互回答状态, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: "#/components/responses/Problem" }
  /client/sync:
    get:
      operationId: clientSync
      tags: [Client Protocol]
      security: [{ clientBearer: [] }]
      parameters:
        - { name: afterCursor, in: query, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200": { description: 持久同步事件, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "410": { description: 游标过期，必须按 Control 重置, content: { application/problem+json: { schema: { $ref: "#/components/schemas/ProblemDetails" } } } }
        default: { $ref: "#/components/responses/Problem" }
  /client/updates:
    get:
      operationId: clientUpdatesWebSocket
      tags: [Client Protocol]
      security: [{ clientBearer: [] }]
      description: 升级为 WebSocket；durable 事件使用全局 cursor，live 事件使用 runEventSeq。
      parameters:
        - { name: cursor, in: query, schema: { type: integer, format: int64, minimum: 0 } }
      responses:
        "101": { description: WebSocket 已升级 }
        default: { $ref: "#/components/responses/Problem" }
  /client/device/push-token:
    put:
      operationId: clientPutPushToken
      tags: [Client Protocol]
      security: [{ clientBearer: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object, required: [token, platform, appEnvironment], properties: { token: { type: string }, platform: { type: string, enum: [ios, android] }, appEnvironment: { type: string, enum: [development, preview, production] } } } }
      responses: { "204": { description: 已注册 }, default: { $ref: "#/components/responses/Problem" } }
    delete:
      operationId: clientDeletePushToken
      tags: [Client Protocol]
      security: [{ clientBearer: [] }]
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses: { "204": { description: 已删除 }, default: { $ref: "#/components/responses/Problem" } }
  /client/device:
    delete:
      operationId: clientDeleteDevice
      tags: [Client Protocol]
      security: [{ clientBearer: [] }]
      responses: { "204": { description: 当前设备已自撤销 }, default: { $ref: "#/components/responses/Problem" } }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: tyrs_hand_session
    workerBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-worker-credential
    clientBearer:
      type: http
      scheme: bearer
      bearerFormat: tyrs-hand-device-token
  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    WorkerResourceID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  requestBodies:
    WorkerJSON:
      required: true
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
  responses:
    Problem:
      description: RFC 9457 Problem Details
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    ResourceList:
      description: 游标分页资源列表
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ResourceList" }
    WorkerJSON:
      description: Worker 直连协议响应
      content:
        application/json:
          schema: { type: object, additionalProperties: true }
  pathItems:
    ListRepositories:
      operationId: listRepositories
      tags: [Resources]
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses: { "200": { $ref: "#/components/responses/ResourceList" }, default: { $ref: "#/components/responses/Problem" } }
    ListAgentProfiles:
      operationId: listAgentProfiles
      tags: [Resources]
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses: { "200": { $ref: "#/components/responses/ResourceList" }, default: { $ref: "#/components/responses/Problem" } }
    ListTriggerRules:
      operationId: listTriggerRules
      tags: [Resources]
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses: { "200": { $ref: "#/components/responses/ResourceList" }, default: { $ref: "#/components/responses/Problem" } }
    ListWorkItems:
      operationId: listWorkItems
      tags: [Resources]
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses: { "200": { $ref: "#/components/responses/ResourceList" }, default: { $ref: "#/components/responses/Problem" } }
    ListThreads:
      operationId: listThreads
      tags: [Resources]
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses: { "200": { $ref: "#/components/responses/ResourceList" }, default: { $ref: "#/components/responses/Problem" } }
    ListJobs:
      operationId: listJobs
      tags: [Resources]
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses: { "200": { $ref: "#/components/responses/ResourceList" }, default: { $ref: "#/components/responses/Problem" } }
    ListWorktrees:
      operationId: listWorktrees
      tags: [Resources]
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses: { "200": { $ref: "#/components/responses/ResourceList" }, default: { $ref: "#/components/responses/Problem" } }
    ListAuditLogs:
      operationId: listAuditLogs
      tags: [Resources]
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses: { "200": { $ref: "#/components/responses/ResourceList" }, default: { $ref: "#/components/responses/Problem" } }
    ListInstallations:
      operationId: listInstallations
      tags: [Resources]
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses: { "200": { $ref: "#/components/responses/ResourceList" }, default: { $ref: "#/components/responses/Problem" } }
    ListRepoCaches:
      operationId: listRepoCaches
      tags: [Resources]
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses: { "200": { $ref: "#/components/responses/ResourceList" }, default: { $ref: "#/components/responses/Problem" } }
    CreateGeneric:
      tags: [Resources]
      parameters: [{ $ref: "#/components/parameters/CSRFToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IDResource" }
        default: { $ref: "#/components/responses/Problem" }
  schemas:
    ClientSessionSettings:
      type: object
      required: [agentProfileId, model, reasoningEffort, serviceTier, collaborationMode, settingsVersion]
      properties:
        agentProfileId: { type: string, format: uuid }
        model: { type: string, nullable: true }
        reasoningEffort: { type: string, nullable: true, maxLength: 64 }
        serviceTier: { type: string, enum: [standard, fast] }
        collaborationMode: { type: string, enum: [default, plan] }
        settingsVersion: { type: integer, format: int64, minimum: 0 }
    ClientSession:
      type: object
      required: [id, workspaceId, projectId, agentProfileId, title,
        lifecycleState, historyCompleteness, model, reasoningEffort, serviceTier,
        collaborationMode, settingsVersion, lastMessageSeq, lastActivityAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        agentProfileId: { type: string, format: uuid }
        title: { type: string }
        lifecycleState: { type: string, enum: [active, archive_pending, archived, unarchive_pending] }
        historyCompleteness: { type: string, enum: [complete, partial] }
        model: { type: string, nullable: true }
        reasoningEffort: { type: string, nullable: true }
        serviceTier: { type: string, enum: [standard, fast] }
        collaborationMode: { type: string, enum: [default, plan] }
        settingsVersion: { type: integer, format: int64 }
        lastMessageSeq: { type: integer, format: int64 }
        lastActivityAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ClientCreateSession:
      type: object
      required: [projectId, settings, initialMessage]
      properties:
        projectId: { type: string, format: uuid }
        settings: { $ref: "#/components/schemas/ClientSessionSettings" }
        initialMessage:
          type: object
          required: [localId, text]
          properties:
            localId: { type: string, minLength: 1, maxLength: 200 }
            text: { type: string, minLength: 1 }
            attachmentIds: { type: array, maxItems: 10, items: { type: string, format: uuid } }
    ClientProject:
      type: object
      required: [id, workspaceId, name, relativePath, kind, availabilityStatus, branch, dirty]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        name: { type: string }
        relativePath: { type: string }
        kind: { type: string }
        availabilityStatus: { type: string }
        branch: { type: string, nullable: true }
        dirty: { type: boolean }
    ClientModel:
      type: object
      required: [id, displayName, description, supportedReasoningEfforts,
        defaultReasoningEffort, isDefault]
      properties:
        id: { type: string }
        model: { type: string }
        displayName: { type: string }
        description: { type: string }
        supportedReasoningEfforts:
          type: array
          items:
            type: object
            required: [reasoningEffort, description]
            properties:
              reasoningEffort: { type: string, minLength: 1 }
              description: { type: string }
        defaultReasoningEffort: { type: string, minLength: 1 }
        inputModalities: { type: array, items: { type: string } }
        additionalSpeedTiers: { type: array, items: { type: string } }
        serviceTiers:
          type: array
          items:
            type: object
            required: [id, name, description]
            properties:
              id: { type: string }
              name: { type: string }
              description: { type: string }
        defaultServiceTier: { type: string, nullable: true }
        isDefault: { type: boolean }
        hidden: { type: boolean }
    ClientModelCatalog:
      type: object
      required: [data]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/ClientModel" } }
        nextCursor: { type: string, nullable: true }
    ClientBootstrap:
      type: object
      required: [serverId, protocolVersion, currentCursor, user, capabilities, workspaces,
        projects, agentProfiles, modelCatalogs, lastStartedSettings]
      properties:
        serverId: { type: string, format: uuid }
        protocolVersion: { type: integer, enum: [3] }
        currentCursor: { type: integer, format: int64, minimum: 0 }
        user:
          type: object
          required: [id, username]
          properties:
            id: { type: string, format: uuid }
            username: { type: string }
        capabilities: { type: object, additionalProperties: { type: boolean } }
        workspaces: { type: array, items: { type: object, additionalProperties: true } }
        projects: { type: array, items: { $ref: "#/components/schemas/ClientProject" } }
        agentProfiles:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
        modelCatalogs:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ClientModelCatalog" }
        lastStartedSettings:
          allOf: [{ $ref: "#/components/schemas/ClientSessionSettings" }]
          nullable: true
    Worker:
      type: object
      required: [id, name, roles, enabled, maxConcurrentJobs, protocolVersion, status, metadata]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        roles: { type: array, items: { type: string, enum: [github, discord] } }
        enabled: { type: boolean }
        maxConcurrentJobs: { type: integer, minimum: 1 }
        protocolVersion: { type: integer }
        workerVersion: { type: string }
        status: { type: string, enum: [pending, online, offline, disabled, incompatible, error] }
        heartbeatAt: { type: string, format: date-time }
        lastError: { type: string }
        metadata: { type: object, additionalProperties: true }
    WorkerInput:
      type: object
      required: [name, roles, maxConcurrentJobs]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        roles: { type: array, minItems: 1, items: { type: string, enum: [github, discord] } }
        maxConcurrentJobs: { type: integer, minimum: 1 }
    EnrollmentToken:
      type: object
      required: [enrollmentToken, expiresIn]
      properties:
        enrollmentToken: { type: string, writeOnly: true }
        expiresIn: { type: integer, enum: [900] }
    WorkerCreated:
      allOf:
        - { $ref: "#/components/schemas/EnrollmentToken" }
        - type: object
          required: [worker]
          properties: { worker: { $ref: "#/components/schemas/Worker" } }
    WorkerDefaults:
      type: object
      properties:
        githubWorkerId: { type: string, format: uuid, nullable: true }
        discordWorkerId: { type: string, format: uuid, nullable: true }
    SSHCredential:
      type: object
      required: [id, name, publicKey, fingerprint, enabled, version, hostCount, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        publicKey: { type: string, readOnly: true }
        fingerprint: { type: string, readOnly: true }
        enabled: { type: boolean }
        version: { type: integer, format: int64, readOnly: true }
        hostCount: { type: integer, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
    SSHCredentialList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SSHCredential" } }
    SSHCredentialCreateInput:
      type: object
      required: [name, privateKey, enabled]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        privateKey: { type: string, minLength: 1, writeOnly: true }
        passphrase: { type: string, writeOnly: true }
        enabled: { type: boolean }
    SSHCredentialUpdateInput:
      type: object
      required: [name, enabled]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        privateKey:
          type: string
          writeOnly: true
          description: 非空时显式轮换私钥；空字符串表示保持现有私钥
        passphrase: { type: string, writeOnly: true }
        enabled: { type: boolean }
    SSHHost:
      type: object
      required: [id, alias, hostname, port, username, credentialId, credentialName, workerIds, enabled, updatedAt]
      properties:
        id: { type: string, format: uuid }
        alias: { type: string }
        hostname: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        username: { type: string }
        credentialId: { type: string, format: uuid }
        credentialName: { type: string, readOnly: true }
        proxyJumpHostId: { type: string, format: uuid }
        proxyJumpAlias: { type: string, readOnly: true }
        workerIds: { type: array, items: { type: string, format: uuid } }
        enabled: { type: boolean }
        updatedAt: { type: string, format: date-time, readOnly: true }
    SSHHostInput:
      type: object
      required: [alias, hostname, port, username, credentialId, workerIds, enabled]
      properties:
        alias: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9._-]+$" }
        hostname: { type: string, minLength: 1, maxLength: 255 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        username: { type: string, minLength: 1, maxLength: 128 }
        credentialId: { type: string, format: uuid }
        proxyJumpHostId: { type: string, format: uuid }
        workerIds: { type: array, items: { type: string, format: uuid }, uniqueItems: true }
        enabled: { type: boolean }
    SSHHostImportItem:
      type: object
      required: [alias, hostname, port, username]
      properties:
        alias: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9._-]+$" }
        hostname: { type: string, minLength: 1, maxLength: 255 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        username: { type: string, minLength: 1, maxLength: 128 }
        proxyJumpAlias: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9._-]+$" }
    SSHHostImportInput:
      type: object
      required: [credentialId, workerIds, enabled, hosts]
      properties:
        credentialId: { type: string, format: uuid }
        workerIds: { type: array, items: { type: string, format: uuid }, uniqueItems: true }
        enabled: { type: boolean }
        hosts:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/SSHHostImportItem" }
    SSHHostList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/SSHHost" } }
    WorkerSSHCredential:
      type: object
      required: [id, privateKey, publicKey, fingerprint]
      properties:
        id: { type: string, format: uuid }
        privateKey: { type: string, writeOnly: true }
        passphrase: { type: string, writeOnly: true }
        publicKey: { type: string }
        fingerprint: { type: string }
    WorkerSSHHost:
      type: object
      required: [alias, hostname, port, username, credentialId]
      properties:
        alias: { type: string }
        hostname: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        username: { type: string }
        credentialId: { type: string, format: uuid }
        proxyJumpAlias: { type: string }
    WorkerSSHConfiguration:
      type: object
      required: [revision, credentials, hosts]
      properties:
        revision: { type: string }
        credentials: { type: array, items: { $ref: "#/components/schemas/WorkerSSHCredential" } }
        hosts: { type: array, items: { $ref: "#/components/schemas/WorkerSSHHost" } }
    WorkerEnrollRequest:
      type: object
      required: [token]
      properties: { token: { type: string, writeOnly: true } }
    WorkerEnrollResponse:
      type: object
      required: [workerId, credential, protocolVersion]
      properties:
        workerId: { type: string, format: uuid }
        credential: { type: string, writeOnly: true }
        protocolVersion: { type: integer }
    WorkerHeartbeat:
      type: object
      required: [workerVersion, protocolVersion]
      properties:
        workerVersion: { type: string }
        protocolVersion: { type: integer }
        metadata: { type: object, additionalProperties: true }
    WorkerClaimRequest:
      type: object
      required: [role, wait]
      properties:
        role: { type: string, enum: [all, github, discord] }
        wait: { type: boolean }
    WorkerClaimResponse:
      type: object
      properties:
        task: { type: object, additionalProperties: true }
    WorkerSessionTitleTask:
      type: object
      required: [id, sessionId, workspaceId, firstMessage, titleRevision, attempt, leaseToken, leaseExpiresAt]
      properties:
        id: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        firstMessage: { type: string, maxLength: 2000 }
        titleRevision: { type: integer, format: int64, minimum: 0 }
        attempt: { type: integer, minimum: 1, maximum: 3 }
        leaseToken: { type: string, writeOnly: true }
        leaseExpiresAt: { type: string, format: date-time }
    WorkerSessionTitleClaimResponse:
      type: object
      properties:
        task: { $ref: "#/components/schemas/WorkerSessionTitleTask" }
    WorkerSessionTitleCompleteRequest:
      type: object
      required: [leaseToken, titleRevision, title]
      properties:
        leaseToken: { type: string, writeOnly: true }
        titleRevision: { type: integer, format: int64, minimum: 0 }
        title: { type: string, minLength: 1, maxLength: 36 }
    WorkerSessionTitleFailRequest:
      type: object
      required: [leaseToken, errorCode]
      properties:
        leaseToken: { type: string, writeOnly: true }
        errorCode: { type: string, minLength: 1, maxLength: 80 }
    WorkerRunLease:
      type: object
      required: [leaseToken, leaseEpoch]
      properties:
        leaseToken: { type: string, writeOnly: true }
        leaseEpoch: { type: integer, format: int64 }
    WorkerEvent:
      type: object
      required: [sequence, type, payload]
      properties:
        sequence: { type: integer, format: int64, minimum: 1 }
        type: { type: string }
        payload: { type: object, additionalProperties: true }
    WorkerEventsRequest:
      allOf:
        - { $ref: "#/components/schemas/WorkerRunLease" }
        - type: object
          required: [events]
          properties:
            events: { type: array, items: { $ref: "#/components/schemas/WorkerEvent" } }
    WorkerCompleteRequest:
      allOf:
        - { $ref: "#/components/schemas/WorkerRunLease" }
        - type: object
          required: [idempotencyKey, result]
          properties:
            idempotencyKey: { type: string }
            result: { type: object, additionalProperties: true }
    WorkerFailRequest:
      allOf:
        - { $ref: "#/components/schemas/WorkerRunLease" }
        - type: object
          required: [idempotencyKey, code, message]
          properties:
            idempotencyKey: { type: string }
            code: { type: string }
            message: { type: string }
    WorkerCommandAck:
      allOf:
        - { $ref: "#/components/schemas/WorkerRunLease" }
        - type: object
          required: [commandId, action]
          properties:
            commandId: { type: string, format: uuid }
            action: { type: string, enum: [steer, interrupt] }
            turnId: { type: string }
    ProblemDetails:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        requestId: { type: string }
    SetupStatus:
      type: object
      required: [setupRequired, githubConfigured]
      properties:
        setupRequired: { type: boolean }
        githubConfigured: { type: boolean }
    SetupRequest:
      type: object
      required: [setupToken, username, password]
      properties:
        setupToken: { type: string, minLength: 16 }
        username: { type: string, minLength: 3, maxLength: 64 }
        password: { type: string, minLength: 12, maxLength: 256 }
    SetupResult:
      type: object
      required: [totpSecret, provisioningUri, recoveryCodes]
      properties:
        totpSecret: { type: string }
        provisioningUri: { type: string, format: uri }
        recoveryCodes: { type: array, items: { type: string } }
    LoginRequest:
      type: object
      required: [username, password, totp]
      properties:
        username: { type: string }
        password: { type: string }
        totp: { type: string, pattern: "^[0-9]{6}$" }
    LoginResult:
      type: object
      required: [username, csrfToken, expiresAt]
      properties:
        username: { type: string }
        csrfToken: { type: string }
        expiresAt: { type: string, format: date-time }
    Administrator:
      type: object
      required: [id, username, csrfToken, expiresAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        csrfToken: { type: string }
        expiresAt: { type: string, format: date-time }
    GitHubAppStatus:
      type: object
      required: [configured]
      properties:
        configured: { type: boolean }
        appId: { type: integer, format: int64 }
        clientId: { type: string }
        appSlug: { type: string }
    GitHubAppInput:
      type: object
      required: [appId, appSlug, privateKey, webhookSecret]
      properties:
        appId: { type: integer, format: int64, minimum: 1 }
        clientId: { type: string }
        appSlug: { type: string }
        privateKey: { type: string, writeOnly: true }
        webhookSecret: { type: string, writeOnly: true }
        clientSecret: { type: string, writeOnly: true }
    RepositoryInput:
      type: object
      required: [installationExternalId, accountLogin, repositoryExternalId, owner, name, defaultBranch, cloneUrl]
      properties:
        installationExternalId: { type: integer, format: int64 }
        accountLogin: { type: string }
        accountType: { type: string, default: Organization }
        repositoryExternalId: { type: integer, format: int64 }
        owner: { type: string }
        name: { type: string }
        defaultBranch: { type: string }
        cloneUrl: { type: string, format: uri }
    TriggerRuleInput:
      type: object
      required: [repositoryId, agentProfileId, name, eventName, triggerKind, instruction]
      properties:
        repositoryId: { type: string, format: uuid }
        agentProfileId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 128 }
        eventName: { type: string, minLength: 1 }
        action: { type: string }
        enabled: { type: boolean }
        priority: { type: integer, default: 100 }
        triggerKind:
          type: string
          enum: [event, label, slash_command, mention_command, legacy_mention]
        triggerValue:
          type: string
          description: Label 名或不带斜杠的命令名；event、mention_command 与 legacy_mention 留空。
        actorMinPermission:
          type: string
          enum: [read, triage, write, maintain, admin]
          default: triage
        instruction: { type: string, minLength: 1 }
        skills: { type: array, items: { type: string } }
        allowedTools: { type: array, items: { type: string } }
        dangerousActions: { type: array, items: { type: string } }
        filters: { type: object, additionalProperties: true }
    GitHubAgentInstructions:
      type: object
      required: [content]
      properties:
        content: { type: string, maxLength: 262144 }
    GitHubAgentPreferences:
      type: object
      properties:
        model: { type: string, nullable: true, maxLength: 128 }
        reasoningEffort: { type: string, nullable: true, maxLength: 64 }
        serviceTier: { type: string, nullable: true, enum: [standard, fast] }
    GitHubAgentEffectivePreferences:
      type: object
      required: [model, reasoningEffort, serviceTier]
      properties:
        model: { type: string }
        reasoningEffort: { type: string }
        serviceTier: { type: string, enum: [standard, fast] }
    GitHubAgentRepositorySettings:
      type: object
      required: [id, owner, name, settings, effective]
      properties:
        id: { type: string, format: uuid }
        owner: { type: string }
        name: { type: string }
        settings: { $ref: "#/components/schemas/GitHubAgentPreferences" }
        effective: { $ref: "#/components/schemas/GitHubAgentEffectivePreferences" }
    GitHubAgentSettingsList:
      type: object
      required: [items, models]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/GitHubAgentRepositorySettings" } }
        models: { type: array, items: { $ref: "#/components/schemas/ClientModel" } }
    DiscordSettings:
      type: object
      required: [guildId, enabled, communityEnabled, tokenConfigured]
      properties:
        guildId: { type: string }
        enabled: { type: boolean }
        communityEnabled: { type: boolean }
        applicationId: { type: string }
        botUserId: { type: string }
        tokenConfigured: { type: boolean }
    DiscordSettingsInput:
      type: object
      required: [guildId, enabled]
      properties:
        guildId: { type: string, pattern: "^[0-9]+$" }
        enabled: { type: boolean }
        botToken: { type: string, writeOnly: true }
        applicationId: { type: string, pattern: "^[0-9]*$" }
        botUserId: { type: string, pattern: "^[0-9]*$" }
    DiscordStatus:
      type: object
      required: [configured, enabled, gatewayStatus, pendingOutbox, failedOutbox, pendingInitializationOperations]
      properties:
        configured: { type: boolean }
        enabled: { type: boolean }
        gatewayStatus: { type: string }
        gatewayError: { type: string }
        lastGatewayAt: { type: string, format: date-time }
        pendingOutbox: { type: integer, format: int64 }
        failedOutbox: { type: integer, format: int64 }
        pendingInitializationOperations: { type: integer, format: int64 }
    DiscordInitializationInput:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [incremental, fresh] }
        confirmation: { type: string }
    DiscordConflict:
      type: object
      required: [name, reason]
      properties:
        name: { type: string }
        reason: { type: string }
    DiscordPreflight:
      type: object
      required: [guildId, mode, creates, updates, deletes, conflicts, missingPermissions, channelCount, safe]
      properties:
        guildId: { type: string }
        mode: { type: string, enum: [incremental, fresh] }
        creates: { type: array, items: { type: string } }
        updates: { type: array, items: { type: string } }
        deletes: { type: array, items: { type: string } }
        conflicts: { type: array, items: { $ref: "#/components/schemas/DiscordConflict" } }
        missingPermissions: { type: array, items: { type: string } }
        channelCount: { type: integer }
        safe: { type: boolean }
    DiscordInitialization:
      type: object
      required: [id, guildId, mode, status, preflight, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        guildId: { type: string }
        mode: { type: string }
        status: { type: string }
        preflight: { $ref: "#/components/schemas/DiscordPreflight" }
        error: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DiscordMember:
      type: object
      required: [guildId, discordUserId, username, displayName, bound]
      properties:
        guildId: { type: string }
        discordUserId: { type: string }
        username: { type: string }
        displayName: { type: string }
        bound: { type: boolean }
        githubLogin: { type: string }
    WorkspaceForumCollaborator:
      type: object
      required: [forumId, memberId, accessLevel, administratorBypass]
      properties:
        forumId: { type: string, format: uuid }
        memberId: { type: string }
        accessLevel: { type: string, enum: [readonly, operator] }
        administratorBypass: { type: boolean }
    WorkspaceForum:
      type: object
      required: [id, name, discordId, bindingStatus, collaborators]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        discordId: { type: string }
        bindingStatus: { type: string, enum: [active, inactive] }
        collaborators:
          type: array
          items: { $ref: "#/components/schemas/WorkspaceForumCollaborator" }
    WorkspaceProject:
      type: object
      required: [id, name, relativePath, projectKind, availabilityStatus, dirty, lastSeenAt, forums]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        relativePath: { type: string }
        desiredRelativePath: { type: string }
        projectKind: { type: string, enum: [directory, git] }
        availabilityStatus: { type: string, enum: [available, missing] }
        branch: { type: string }
        headSha: { type: string }
        dirty: { type: boolean }
        remoteUrl: { type: string }
        lastSeenAt: { type: string, format: date-time }
        scanError: { type: string }
        forums:
          type: array
          items: { $ref: "#/components/schemas/WorkspaceForum" }
    Workspace:
      type: object
      required: [id, ownerDiscordUserId, ownerName, projects]
      properties:
        id: { type: string, format: uuid }
        ownerDiscordUserId: { type: string }
        ownerName: { type: string }
        workerId: { type: string, format: uuid }
        projectsScannedAt: { type: string, format: date-time }
        projectScanError: { type: string }
        projects:
          type: array
          items: { $ref: "#/components/schemas/WorkspaceProject" }
    WorkspaceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Workspace" }
    WorkspaceProjectForumInput:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [new, restore] }
        forumId: { type: string, format: uuid }
        name: { type: string, maxLength: 100 }
    IDResource:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
    ResourceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { type: object, additionalProperties: true }
        nextCursor: { type: string }
security:
  - sessionCookie: []
